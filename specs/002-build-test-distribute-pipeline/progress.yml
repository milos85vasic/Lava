amendment_defect_found_after_landing:
  severity: medium
  status: >-
    RESOLVED 2026-08-26 by WITHDRAWING condition (D). See
    clause_8_amendment_2026_08_26 at the end of this file. The entry below is kept
    verbatim as the forensic record of the finding; it is not rewritten to match the
    outcome.
  what: >-
    §6.AA clause 8 condition (D), landed today under operator approval, requires the
    §6.AK cycle-coverage check to have executed and PASSED for the `debug` channel
    AND the `release` channel, and states the pipeline MUST invoke
    `scripts/check-cycle-coverage.sh --channel=release` explicitly. Its stated
    reasoning is that firebase-distribute.sh resolves AK_CHANNEL to `debug` whenever
    MODE is not exactly `release`, "so a --debug-and-release invocation validates the
    debug channel only".
  why_that_is_a_problem: >-
    The LVA-120 investigation, which completed AFTER the amendment was drafted,
    established that `--channel` is INERT in check-cycle-coverage.sh: CHAN is parsed
    and asserted non-empty, then never used to resolve a path or alter a check. Both
    artifacts resolve from $EDIR+$VER alone, and the evidence files on disk are
    per-version with no debug/release split. So invoking the check twice with
    different --channel values examines the IDENTICAL two files.
  the_actual_defect: >-
    Condition (D) is satisfiable but currently meaningless. A future reader - or a
    future implementer - would reasonably conclude from its text that release-channel
    coverage had been independently verified. It has not been, and cannot be, until
    check-cycle-coverage.sh honours the parameter. That is precisely the shape of
    thing this feature has spent the session evicting: a condition that reads as a
    protection and does not deliver one.
  honest_provenance: >-
    Neither the drafting agent nor the conductor knew this when the amendment was
    reviewed and approved - the drafter reasoned from the same premise the conductor
    later relayed to the operator and afterwards had to correct. The amendment was
    approved in good faith on an incorrect premise about one condition. It is
    recorded here rather than quietly patched, because amending a governing document
    to fix a defect in a governing document is an operator decision.
  it_does_not_invalidate_the_amendment: >-
    Conditions A, B, C, E, F, G, H and I are unaffected and are individually
    load-bearing. Condition (C) - release-variant device evidence, explicitly NOT
    inferable from debug evidence - carries the substantive protection (D) was meant
    to reinforce. The clause is not unsafe; one of its nine conditions is currently
    decorative.
  options_for_the_operator:
    - >-
      [A] Make check-cycle-coverage.sh honour --channel, so (D) becomes real. Its own
      header documents the flag as "(required) e.g. debug | release", which reads as
      original intent left unimplemented. Requires deciding what release-channel
      evidence artifacts look like, since none exist today.
    - >-
      [B] Amend condition (D) to state what it actually verifies - per-version
      coverage, once - and drop the two-channel language. Honest, and cheap.
    - >-
      [C] Retire the --debug-and-release alias (the LVA-120 recommendation). If
      MODE=both becomes unconstructible, (D)'s premise disappears entirely and the
      condition can be struck.
  interim_mitigation_in_flight: >-
    The T043 refusal-gate implementation has been instructed to implement (D)
    HONESTLY: run the check as the clause requires, and have the script's own output
    and recorded evidence state plainly that --channel does not currently
    differentiate. It must not implement a no-op and report it as a pass.

self_audit_of_the_conductors_own_code:
  note: >-
    Every other component of this feature had been audited by an independent agent;
    the code the conductor wrote itself had not. It was the least-examined code in
    the feature and sits at the centre of the run report. 7 confirmed defects.
  headline:
    id: report-says-PASS-for-a-run-that-FAILED
    severity: critical
    what: >-
      The orchestrator's phase registry marks each phase `self-appends-result: yes`
      and TRUSTS it. If a phase script exits non-zero BEFORE appending its own
      phases[] entry, the orchestrator appends nothing, the in-flight marker was
      correctly cleared (the script RETURNED, so it was not interrupted), and the
      run finalizes PASS. Verbatim: `outcome: PASS` / `halted at: test` printed in
      the SAME summary box. The multi-script variant is worse - phases[] comes out
      FULL-LENGTH and all-PASS, indistinguishable from a complete success.
    why_it_survived_the_earlier_fix: >-
      This is the SAME bluff class the in-flight marker work closed, one level up.
      The marker cannot cover it, because the marker's whole semantic is "a script
      is executing right now" and a script that returns is by definition not
      interrupted. The gap was never interruption - it was trusting a script to
      have recorded its own failure.
    fix: >-
      New phase_nonpass_count() in lib/run-report.sh; the orchestrator now VERIFIES
      that a self-appending phase actually recorded a non-PASS entry, instead of
      trusting the registry flag. Regression: tests/pipeline/test_phase_failure_always_recorded.sh.
  other_six:
    - "#5 append_interrupted_phase_if_any: 6 of 7 unusable-marker shapes (empty, whitespace, unreadable, invalid phase name, two names, a directory) read as 'not interrupted' -> PASS."
    - "#5b _close_report discarded the library's failure signal with `|| true` - proven by fixture: the library signalled, the orchestrator threw it away."
    - "#1 recompute_evidence_summary aborted at exit 5 on an uninterpretable record under set -e, so the summary was never written. Its own doc-comment claimed such a record 'counts as FAILED' - that claim was false."
    - "#1b its find selector counted <phase-NN>/raw/x.json as a real Evidence Record; the doc claim about raw/ companions was false on both halves."
    - "#2/#3 the static guard's CHECK A missed rc=\"$?\", a non-echo log helper, ${PIPESTATUS[1]}, declare -i and local -r - i.e. the echo-only fix the conductor made was incomplete."
    - "#4 CHECK F missed --quiet, a pipe at end-of-line, and -m1 -q."
    - "#7 test_interrupted_run_never_passes.sh CASE 3 examined ZERO items - it stayed green against a LIVE cross-run marker leak, proving the case was vacuous."
  discipline_observed:
    mutation_proofs: 4, each RED-then-GREEN with a byte-identical revert
    candidates_withdrawn_before_reporting: >-
      Two. A 'miscounted record' that turned out to be a .jsonl substring match, and
      one of its own strengthened CHECK A's false positives -
      phase-02-test-challenge.sh:809 DOES consume its rc, by handing it to an
      embedded Python parser. Rather than annotate a file outside its surface, it
      taught the check to tell a standalone argument from a variable embedded in prose.
    escapes_left_open_deliberately: >-
      Two, with measured reasons recorded in the guard's own known-uncovered section:
      CHECK C on non-*_ref names (zero true positives available today) and CHECK B on
      multi-line jq (needs quote tracking; CHECK F's cheap line-join has no safe analogue).

conductor_self_inflicted_defect:
  id: covenant-test-restore-did-not-survive-a-kill
  what: >-
    tests/check-constitution/test_covenant_114_propagation.sh mutates root CLAUDE.md
    to prove its own falsifiability and restores it with `trap ... RETURN`. A RETURN
    trap fires when the FUNCTION returns; it does not fire when the process is killed.
    The conductor ran the test under `timeout 120`, it exceeded that, was SIGTERMed
    mid-probe, and left `§11.4.134` replaced by `§REDACTED_ANCHOR` in CLAUDE.md.
  consequence: >-
    The next full check-constitution.sh run reported CM-COVENANT-114 VIOLATION, and
    the damage was initially attributed to a stray agent edit before the real cause
    was found. A doc-sync stream independently reported the same symptom.
  fix: >-
    Trap widened to RETURN EXIT INT TERM. That first attempt introduced a SECOND bug
    - the handler referenced the function's `local backup`, which is out of scope when
    an EXIT trap fires late, producing `backup: unbound variable` under set -u.
    Corrected by moving the handler to a file-scope _covenant_restore() with a
    ${:-} guard, making it idempotent and safe before the backup exists.
    Re-verified: exit 0, 4/4 PASS, zero unbound-variable errors, CLAUDE.md intact.

t043_delivered_gate_only:
  what: >-
    scripts/pipeline/phase-05-distribute.sh - the §6.AA clause 8 refusal gate and
    ONLY that. Never invokes firebase-distribute.sh (condition (F) is static
    inspection), writes no Distribution Record, not wired into the orchestrator.
    Exit 2 = REFUSED (the default), 3 = QUALIFIED-but-distribute-unimplemented,
    0 reserved and currently unreachable. No force/bypass flag exists, unknown flags
    are fatal, and a condition that cannot be evaluated REFUSES.
  tests: tests/pipeline/test_phase_05_distribute_gate.sh - 24/24 PASS
  channel_finding_extended: >-
    Independently verified, and worse than previously established: --channel is not
    only inert, it is not VALIDATED. `debug`, `release` and `banana` all return exit
    0 with byte-identical stdout. Condition (D) therefore reports PASS (DEGRADED)
    with the disclosure written into both stdout and gate-verdict.json, rather than
    claiming a release-channel verification that does not exist.
  detector_bug_it_caught_in_itself: >-
    Its first channel detector compared the check's OUTPUT across channels - but its
    own test stub echoed the channel back, which made an inert flag look functional.
    That detector would have certified the bluff. Replaced with static analysis of
    the check script; only a script that positively READS the channel clears the
    degradation, and `unknown` degrades too.

second_amendment_defect_found_after_landing:
  id: clause-8-conditions-A-and-H-deadlock
  severity: medium
  status: >-
    RESOLVED 2026-08-26 by REWORDING the condition (now (G)) to record the gap
    through build_artifacts[].build_output_path, a property the schema already
    defines. No schema amendment was made; the residual-gap tolerance in the gate
    was REMOVED. See clause_8_amendment_2026_08_26 at the end of this file. The
    entry below is kept verbatim as the forensic record of the finding.
  what: >-
    pipeline-run-report.schema.json is additionalProperties:false and does not define
    `residual-gap`, yet clause 8 condition (H) MANDATES that exact field on the run
    report. Read literally, condition (A) - which requires the report to validate
    against that schema - can never hold once (H) is satisfied. No run can qualify.
  interim: >-
    The gate tolerates `residual-gap` as the single clause-8 extension so the clause
    stays operable; every other unknown property still fails (A). It prints
    SCHEMA AMENDMENT OWED on every affected run.
  needed: A schema amendment adding `residual-gap`, or a rewording of (H).

amendment_defects_proposal_delivered:
  file: specs/002-build-test-distribute-pipeline/amendment-defects-proposal.md
  scope: >-
    Operator-ready options for both defects found IN the landed clause-8 text.
    Governing files and schemas were off-limits to the drafting pass and it
    modified none - verified: contracts/ shows 0 modifications.
  precision_correction_to_defect_2: >-
    The deadlock was described as "satisfying (H) makes the report schema-invalid,
    so (A) fails". True, but NOT what happens today. Verified independently:
    scripts/pipeline/lib/run-report.sh - the report GENERATOR - never emits
    `residual-gap` (0 occurrences), and 0 of the 47 reports on disk contain it. So
    condition (H) fails today for the simpler reason that the field is never
    written. Net effect is the same and is the SAFE direction: clause 8 cannot
    qualify on any run today, and it FAILS CLOSED. The phase-05 tolerance for
    `residual-gap` is anticipating a state that is never reached.
  new_finding_channel_means_two_different_things: >-
    "Channel" carries two conflicting meanings in this codebase.
    contracts/distribution-record.schema.json defines `channel` as the Firebase
    APP (client vs api-app); firebase-distribute.sh:322-324 uses AK_CHANNEL for the
    BUILD VARIANT (debug vs release). check-cycle-coverage.sh's --evidence-dir
    already carries the app-channel, so --channel is a SECOND axis wearing the same
    word. Any repair that implements --channel must disambiguate this first, or it
    encodes the collision permanently.
  also_established: >-
    No release-channel artifacts exist at all - the evidence tree partitions by APP
    (firebase-app-distribution/, firebase-app-distribution-api-app/) with no
    debug/release split at any level. So implementing --channel requires first
    INVENTING what release-channel evidence is, which is a design decision, not a
    code fix.
  recommendations:
    defect_1: >-
      1-C (retire the --debug-and-release alias) PLUS 1-B's rewording of (D). 1-C is
      the only option that fixes the defect in the shared script rather than in its
      description: --release-only already resolves AK_CHANNEL=release and already
      runs the §6.AA staging gate, so only the combined mode is broken, and every
      future caller benefits. It preserves the operator's no-pause requirement - two
      stages back-to-back - removing only the flag, which was never the requirement.
      1-B is recommended ALONGSIDE because even then the per-variant check does not
      exist, and (D)'s replacement must say so.
    defect_2: >-
      2-A (amend the schema), drafted with a SINGLE-MEMBER enum so
      `residual-gap: "none"` cannot satisfy (H)'s letter while inverting its intent,
      and deliberately NOT added to `required`. It closes step 5 of the original
      migration plan, which specified this schema extension before the clause landed
      without it. 2-C (relaxing additionalProperties) is explicitly NOT recommended:
      it permanently surrenders top-level shape enforcement on the very artifact
      phase-05 reads to authorize distributions to real users, and its own migration
      step reimplements the lost check in bash - conceding the protection is still
      wanted, only enforced somewhere weaker.
  declined_to_recommend: >-
    Three items carry NO recommendation, stated as such rather than filled with
    manufactured confidence: the partial-distribution semantics under 1-C (debug
    uploaded, release refused - changes `outcome` and the exit code); the
    residual-gap vs residual_gap naming (every other contract property is
    snake_case, but renaming needs a CLAUDE.md edit for style alone); and whether to
    add a verify-the-mechanism step to the amendment procedure - both defects share
    that root cause, but a third nested proposal is the wrong vehicle for it.

