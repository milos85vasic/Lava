lva_130_criterion_is_itself_wrong:
  status: needs a REVISED criterion, not an implementation
  what_the_ticket_asks: >-
    LVA-130's closure criterion requires `outcome` to resolve to FAIL "whenever the
    recorded phase sequence is a proper prefix of the phase set the invocation
    requested". The filing pass correctly reported the criterion as NOT met, because
    finalize_run_report evaluates only `(.phases|length) > 0 and all(PASS)` and has
    no knowledge of the requested phase set.
  why_implementing_it_literally_would_be_HARMFUL: >-
    Measured directly: a legitimate `--until precondition` run produces
    phases: ['precondition'] - a proper prefix of the wired 8-phase set - and
    correctly exits 0 with outcome PASS. Implementing "prefix => FAIL" would fail
    EVERY --until run, and --until is precisely the mechanism that makes
    quickstart.md's per-user-story slices runnable. The criterion conflates a
    DELIBERATE stop with an INTERRUPTED one.
  why_the_upstream_defence_is_the_right_design: >-
    A report-level prefix check cannot distinguish WHY a sequence is short. The
    defence was therefore placed upstream, where that information exists: the
    per-script in-flight marker records an interruption, and phase_nonpass_count
    verifies that a phase which failed actually recorded its failure rather than
    being trusted to. Together those cover both real causes of a short sequence
    (interruption, and an unrecorded failure) while leaving a deliberate stop alone.
  recommended_disposition: >-
    Close LVA-130 against a REVISED criterion naming the two real failure modes and
    the upstream mechanism that closes them, rather than leaving it open pending an
    implementation that would break legitimate use. This is a reviewer decision, not
    something to change unilaterally - the ticket's criterion was written before the
    --until mechanism existed.

