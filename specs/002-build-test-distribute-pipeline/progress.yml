defects_found_and_fixed_wave7:
  note: >-
    Audit of the four scripts that had never been audited - each had only ever
    been verified by executing it and observing success, which says nothing about
    what happens when something goes wrong. 7 confirmed, all fixed RED-then-GREEN.
  items:
  - id: F3-phase-04-api-app-announced-two-source-cross-check-with-one-source-absent
    severity: high
    what: >-
      Its header promises PASS only when BOTH Gradle's JUnit XML AND the Containers
      attestation row agree. DISAGREEMENT was caught; total ABSENCE fell through to
      PASS. Worse, with no attestation row at all, test_passed=true was a literal in
      the format string rather than a value read from any row - so the record
      asserted that a source agreed when that source had produced nothing.
    fix: FAIL when either source is absent, naming which; test_passed read from the row.
  - id: F4-F5-phase-06-no-op-guard-claim-was-false
    severity: high
    what: >-
      The claim that phase-06 "already guards the exporter-exits-0-but-does-nothing
      case" did not hold. A stubbed exporter exiting 0 and writing nothing produced
      PASS, exit 0, zero .html/.pdf on disk, and a record asserting the siblings were
      verified. Its --check-only exit code was never captured at all, so an upstream
      rename (exit 2 + usage line, grep matching nothing) also passed. On
      --skip-exports the record read, in one sentence, "skipped (--skip-exports);
      every changed .md was re-checked".
    fix: First-hand on-disk sibling check, --check-only exit-code guard, and the
      export claim built from what actually happened.
  - id: F7-challenge-wrapper-laundered-a-successful-exit-into-a-blocked-SKIPPED
    severity: high
    what: >-
      A matrix script exiting 0 with no attestation was classified SKIPPED claiming
      "BLOCKED (real, specific precondition gap)" - a cause the tool's own success
      code contradicts - and SKIPPED does not block the phase. Same laundering shape
      as the release-canary R-A defect.
    fix: rc-aware classification (documented blocked codes -> SKIPPED; 0 or
      undocumented -> FAIL, quoting the code and asserting no cause).
  - id: F1-F2-F6-remaining
    what: >-
      F1 zero-selected challenge run -> PASS; F2 three .kt files on disk reported as
      "discovered 1"; F6 phase-05a asserted a byte count of text it had not written
      (and ${#VAR} counted CHARACTERS, so it was wrong by 7 even on the happy path).
    fix: Refuse zero-selection/zero-record runs; name undiscoverable files; byte count
      from wc -c on disk; refuse a 0-byte snapshot.

defects_found_and_fixed_wave8:
  note: >-
    Two bugs in the static guard itself - the component whose entire purpose is to
    stop this defect family from recurring. Both found within minutes of each other,
    the second introduced by the fix for the first.
  items:
  - id: scanner-CHECK-A-false-negative
    severity: high
    found_by: the four-script audit, which hit the exact case the guard was blind to
    what: >-
      CHECK A's "is this variable ever compared?" test searched the whole file
      including its echo/printf lines, and accepted a bare `[` as evidence of a test
      context. A reporting line like `echo "wrapper [${label}] exited ${rc}"`
      therefore satisfied it - the `[` of the label matched - so a variable that had
      only ever been PRINTED counted as compared. That is precisely the defect the
      check exists to find, so the guard was blind to its own target. Real instance:
      phase-02-test-challenge.sh captured `local rc=$?`, echoed it three times, never
      compared it, and the scanner reported the file clean.
    fix: Strip echo/printf lines from the haystack before looking for a test context.
    falsifiability_proven: >-
      Injected the exact shape (captured, echoed with a bracketed label, never
      compared) into phase-00-precondition.sh; CHECK A flagged it
      ("$PROBE_RC captured, never compared"); reverted byte-identically; green again.
  - id: scanner-SIGPIPE-false-positive-introduced-by-that-fix
    severity: medium
    what: >-
      The first version of the fix piped `grep -v … | grep -q …`. grep -q exits the
      moment it matches, closing the pipe; the upstream grep -v still has output to
      write, takes SIGPIPE and exits 141. Under set -o pipefail the pipeline's status
      IS that 141, so a SUCCESSFUL match was reported as failure. Two genuinely
      compared variables were flagged as never-compared - MATRIX_RC at
      phase-04-live-verify-api-app.sh:506 and rc at phase-06-docs.sh:198, both plainly
      inside `if [[ … -eq … ]]`. Measured directly: both branches returned 141.
    diagnostic_note: >-
      The first hypothesis for this was tested and found WRONG (an early-matching
      probe returned 0 because its output fit the pipe buffer). Only instrumenting
      each branch and reading the actual 141 identified the cause. The wrong
      hypothesis was discarded on evidence rather than acted on.
    irony_worth_recording: >-
      A check for "an exit code was captured and never examined" was defeated by an
      exit code it did not examine closely enough.
    fix: No pipelines - the filtered haystack is precomputed once per file into a
      variable, so there is no upstream process left to signal.

evidence_audit:
  scope: 36 runs, 27 reports, 4339 Evidence Records, all produced by real toolchains
  method: >-
    Independent field-by-field checker driven by reading the contract schemas (no
    JSON-Schema library available on this host), proven falsifiable first against 14
    deliberately-invalid variants including a directory-as-raw-ref. Explicitly a
    manual equivalent, not library validation. Originals never mutated - verified
    afterwards against a pre-audit sha256 manifest of all 4599 JSON files.
  record_level_verdict: TRUSTWORTHY
  record_level_evidence: >-
    4250 of 4339 claims machine-checked against their own raw output file: ZERO
    disagreements. Zero PASS records contradicted by their raw output. Zero shared
    raw_output_ref values anywhere. 288 duplicate-summary groups, every one with
    fully distinct test_ids AND distinct raw refs (the same test name across
    different packages, not shared evidence). Full agreement with three independent
    sources: verify-all attestations 216/216 per-gate, Gradle JUnit XML 2409/2416,
    and a decisive three-way match on the one run whose artifacts survive
    (testcase 33.581s, boot_seconds 169.255462696, APK sha256 a1309ef5…).
  report_level_verdict: NOT TRUSTWORTHY
  report_level_finding: >-
    Every report.json on disk carries evidence_summary.total = 0, and in 12 runs the
    run's own directory contradicts that (e.g. 19-43-22Z reports 0 while holding 54
    records, 6 of them FAIL). All 12 are unfinalized BLOCKED runs driven by phase
    scripts directly rather than through the orchestrator, so recompute never ran -
    consistent with the design, but the consequence stood: recompute_evidence_summary
    had NEVER demonstrably run against real data, only against hermetic fixtures.
  gap_closed: >-
    Closed 2026-08-22 with real data. recompute_evidence_summary was run against a
    COPY of run 2026-08-21T19-43-22Z, whose 54 records came from a real 54-gate
    constitution sweep. Before {total:0,...}; after {total:54, passed:48, failed:6,
    skipped:0, rejected_by_anti_bluff:0} - matching the records physically present
    exactly. The on-disk original was re-read afterwards and still reads total:0,
    confirming the historical evidence was not mutated.
  hardened_validator_replay: >-
    The CURRENT hardened validator was re-run over all 4339 records on a full copy:
    4327 accepted, 12 rejected, BYTE-IDENTICAL to the stored verdicts. Zero newly
    rejected. No record had been rubber-stamped by the older, weaker validator.
  skipped_divergence_resolved: >-
    The audit found 7 records marking a runner-<skipped/> testcase as FAIL, which
    contradicts data-model.md. Investigated rather than fixed: those records were
    written 2026-08-21 17:24, and the kotlin wrapper gained its <skipped/> -> SKIPPED
    branch (line 406) by 22:21. HISTORICAL ARTIFACTS of the pre-fix wrapper, not a
    live defect. No change made.

