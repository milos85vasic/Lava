defects_found_and_fixed:
  - id: evidence-summary-never-populated
    found_during: T038
    severity: high
    what: >-
      report.json's evidence_summary was seeded to all-zeros by init_run_report
      and never updated by anything. finalize_run_report gates outcome:"PASS" on
      evidence_summary.rejected_by_anti_bluff == 0, so that counter being
      permanently 0 made the anti-bluff half of data-model.md's Validation rule a
      silent no-op — a run containing REJECTED Evidence Records could finalize to
      PASS.
    red_evidence: >-
      "FAIL: outcome is 'PASS', expected FAIL - a run containing a REJECTED
      Evidence Record reported success."
    fix: >-
      New recompute_evidence_summary() in scripts/pipeline/lib/run-report.sh
      deriving every count from the physical Evidence Records on disk; called by
      the orchestrator before finalize on every exit path. New hermetic suite
      tests/pipeline/test_run_report_evidence_summary.sh (5 cases, 12 checks).
    bluff_audit: >-
      Mutating the aggregator's REJECTED* match to a never-matching literal
      reproduced the original bluff exactly; reverting restored all-green. Zero
      regressions across the three pre-existing pipeline suites.
  - id: untracked-dir-collapse-in-self-diagnosis
    found_during: T038
    severity: low
    what: >-
      git status --porcelain collapses a fully-untracked directory to a single
      "?? .lava-ci-evidence/" entry, so the orchestrator's first-cut diagnosis for
      the "pipeline dirtied its own tree" footgun matched nothing.
    fix: "Use --untracked-files=all; re-verified against a fixture with the T003 ignore rule removed."

