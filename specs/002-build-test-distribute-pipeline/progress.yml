t047_findings_beyond_the_task:
  - id: FR-000-is-defeatable-by-a-skip-worktree-bit
    severity: medium
    what: >-
      FR-000 reported "precondition satisfied — on master, working tree clean" while
      the tree was NOT clean, because a `git update-index --skip-worktree` bit was
      set on the mutated file. The guard trusts git's REPORT rather than the
      filesystem. Disclosed and used deliberately (quickstart Scenario 3 is
      unrunnable otherwise), but it is a real property of the pipeline's only safety
      boundary.
  - id: a-running-script-edited-mid-run-is-corrupted
    severity: medium
    operational: true
    what: >-
      A run died with `line 471: syntax error near unexpected token '('` and exited 2
      instead of the documented 1. Checksums prove the cause: the orchestrator's
      hash changed DURING the run window, because a concurrent agent was editing it.
      Bash reads scripts lazily by byte offset, so editing a running script corrupts
      it mid-execution. The snapshot re-run exited 0 cleanly and `bash -n` passes -
      a measurement artifact, not an orchestrator defect.
    lesson: Pipeline runs must execute from an IMMUTABLE COPY of the scripts.
  - id: the-interrupted-run-guard-worked-under-real-corruption
    positive: true
    what: >-
      Despite dying mid-finalization, that run's report read `outcome: "BLOCKED"` and
      never PASS. Independent confirmation that the in-flight/finalize work holds
      under a real, unplanned failure - not just under fixtures. It did carry
      evidence_summary.total 0 against 1540 real records, because
      recompute_evidence_summary was precisely the function being corrupted.
  - id: pipeline-runs-gitignored-only-on-the-feature-branch
    severity: medium
    what: >-
      Verified directly: `.gitignore` at master contains ZERO `pipeline-runs`
      entries; this branch has 1. FR-000 requires the pipeline to run on master, so
      until this feature merges, the pipeline cannot self-host on a real master
      checkout without dirtying the tree it is about to test. Same for the
      jackett self-dirtying fix, which also lives only on this branch. Not a design
      flaw - an unmerged-feature artifact - but it means T062's end-to-end run must
      account for it.

t061_rerun_attempt_1_INCONCLUSIVE:
  result: CI_EXIT=1 - and the cause is a RACE, not a real gate failure
  how_far_it_got: >-
    forbidden-files PASS, host-power regex PASS, Spotless BUILD SUCCESSFUL in 1m14s,
    unit tests BUILD SUCCESSFUL in 2m22s, then the Constitutional doc parser reached
