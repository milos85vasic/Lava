  - id: K-2-unparseable-reports-silently-dropped
    what: A truncated JUnit XML containing a real <failure> was warned about and
      then ignored. A JUnit XML is truncated precisely when the JVM died.
  - id: K-3-zero-testcases-parsed-exits-zero
    what: Reports present, zero <testcase> parsed, exit 0 with zero records.
  - id: H-1-empty-enumeration-passes
    what: Suite enumeration matching nothing runnable reported exit 0 with zero
      records.
  - id: H-2-skips-left-no-evidence-record
    what: The header claimed skips are never silently omitted; the only reporting
      was a console line that never reaches the run report.
  - id: S-A-S-B-empty-or-unreadable-dimensions-pass
    what: Empty or unreadable dimensions[] reported PASSED even when the truncated
      JSON's own readable content said "verdict":"FAIL".
  - id: S-C-harness-exit-code-never-compared
    what: All-PASS dimensions plus harness exit 1 reported PASSED, though the
      header says exit 0 additionally asserts no goroutine/FD leak.
  - id: S-D-ran-flag-string-compare-matches-null
    what: '.ran read as a string and compared to "true" also matches a MISSING
      key (null), so an unrecognized dimension shape was downgraded to a
      non-blocking skip. Same defect class as the gate-sweep jq // bug.'
  - id: R-A-undocumented-exit-codes-laundered-into-SKIPPED
    severity: high
    what: run-release-canary.sh documents exits 0/1/2 and runs under set -e, so a
      missing tool yields 127 and a kill yields 137. Both were reported as
      "genuinely did not execute ... real host/config precondition gap" with
      result SKIPPED and wrapper exit 0. SKIPPED does not block the phase, so a
      dead canary harness silently disabled the §6.Z cold-start gate.

defect_class_closed_mechanically:
  suite: tests/pipeline/test_no_vacuous_pass_patterns.sh
  rationale: >-
    Twenty-three defects were found and fixed during this feature's
    implementation and the overwhelming majority were the same family. Fixing
    twenty-three bugs is not the same as closing a defect class, so the recurring
    shapes were turned into a standing static guard over scripts/pipeline/** and
    the orchestrator. (This paragraph read "nineteen" until 2026-08-22: the prose
    count went stale as later waves landed while the enumerated entries below
    kept growing. Corrected after the workable-items filing pass counted the
    actual entries and reported the discrepancy rather than filing against the
    prose. The enumerated items, not this sentence, are authoritative.)
  checks:
  - id: A
    what: An exit code captured into a variable and then never compared.
    seen_in_production: >-
      phase-02-test-go.sh (the real go test rc), phase-02-test-kotlin.sh
      (GRADLE_EXIT_CODE), phase-02-test-stress-chaos.sh (RUN_RC) - each reported
      PASS while the underlying tool had genuinely failed.
  - id: B
    what: A jq // fallback applied to a field whose meaningful value can be falsy.
    seen_in_production: >-
      phase-02-test-constitutional-gate-sweep.sh turned a real "all_passed": false
      into "unknown"; phase-02-test-stress-chaos.sh compared .ran as a string to
      "true", which also matched a missing key.
  - id: C
    what: -e / -s standing in for -f on a value that must be a regular file.
    seen_in_production: >-
      anti-bluff-validate.sh - both tests are TRUE for a directory (its inode has
      non-zero size), so an empty raw_output_ref resolving to the record's own
      directory satisfied the "captured output exists and is non-empty" rules.
  escape_hatch: >-
    An inline "# vacuous-pass-ok: <reason>" comment on the same line. Deliberately
    requires the reasoning to be written down rather than allowing a silent
    exemption. Six legitimate cases were annotated this way rather than being
    silenced - most importantly phase-03's HEALTH_RC, where NOT trusting the rc
    is itself the load-bearing anti-bluff decision (§6.B: the status binary exits
    0 while reporting "Healthy: false", proven for real during T035).
  scanner_own_defect_found_and_fixed: >-
    On its first real run, Check B flagged the explanatory COMMENT in the
    gate-sweep wrapper that quotes the very bug it fixed. A scanner that reports
    the documentation of a fixed bug as the bug is a false-positive generator;
    it now skips comment lines.
  falsifiability_proven: >-
    All three checks were rehearsed by re-introducing a real historical defect
    and confirming detection: the jq // bug (Check B), a bare -s on a raw file
    ref (Check C), and a stripped vacuous-pass-ok annotation on HEALTH_RC
    (Check A). Each reverted byte-identically and the scanner returned to green.
  honest_limits: >-
    A heuristic lint, not a proof. It cannot catch every vacuous pass - the
    phase-01 "recorded an artifact that is not on disk" defect is invisible to
    it - and it is a cheap net for three shapes that have each already reached
    production here, not a substitute for the behavioural suites alongside it.

defects_found_and_fixed_wave5:
  items:
  - id: advance-all-submodules-would-auto-advance-the-constitution-submodule
    severity: critical
    found_during: >-
      Verifying a claim (F-5) made in the T048/T049 constitutional-amendment
      drafts, rather than relaying it. Found BEFORE the script had ever been run
      against a real submodule.
    what: >-
      scripts/advance-all-submodules.sh defaulted to "every submodule" (its own
      LAVA_ADVANCE_SUBMODULES documentation says so) and contained ZERO mention
      of `constitution`. Root CLAUDE.md line 299 states: "The ./constitution/
      submodule itself remains pinned + advanced only per CONST-049's 7-step
      pipeline." An unattended closure phase would therefore have auto-advanced
      the project's own governance submodule - the document set that defines what
      this pipeline is permitted to do at all.
    red_evidence: >-
      Against a fixture whose submodule is named `constitution` with a newer
      upstream commit available, the pre-fix run recorded outcome=ADVANCED,
      parent_pin_updated=true, and the pin genuinely moved.
    fix: >-
      A GOVERNANCE_DENY default-deny list checked FIRST in the loop - before
      fetch, before comparing commits. Deliberately NOT overridable via
      LAVA_ADVANCE_SUBMODULES, because an allow-list is a convenience for
      narrowing a run and a convenience switch must not be able to turn off a
      governance boundary. Matches on the path's final component, so both
      `constitution` and `submodules/constitution` are covered - verified against
      this repo's real `git submodule status` output.
    recorded_not_skipped: >-
      A denied submodule still gets a Submodule Advance Record, with a new
      REFUSED_GOVERNANCE_DENY outcome added to the contract schema. A governance
      refusal that leaves no evidence is invisible at rest - the same
      silently-absent failure mode as a test category with no dispatch line.
      old_commit and new_commit are both the current pin, because no candidate
      commit was ever looked up and claiming otherwise would invent a fact the
      script did not establish.
    second_bug_surfaced_by_the_fix: >-
      The script carried its own internal outcome whitelist separate from the
      schema, which rejected the new value with "internal error - invalid
      outcome". Extending the JSON schema alone was not enough; both had to move.

design_doc_reconciliation:
  scope: data-model.md, quickstart.md, research.md, spec.md, plan.md, checklists/requirements.md
  corrections: 51
  method: >-
    Every claim checked against the real script with a line reference. Where code
    and doc disagreed the code won, and each correction quotes the superseded text
    before replacing it - nothing silently rewritten. research.md and spec.md got
    dated notes rather than rewrites, since they are historical design rationale.
  most_consequential_findings:
  - >-
    data-model.md's description of the BLOCKED outcome was exactly backwards: it
    claimed a precondition refusal produces no report.json at all, when the
    orchestrator deliberately initializes the report FIRST so a refusal is itself
    recorded. The library header carried the same wrong claim; both corrected.
  - >-
    data-model.md required raw_output_ref to "exist and be non-empty" - a rule
    that was literally unenforceable as written, because a directory satisfies
    both tests.
  - >-
    The Report Validation rule as documented omitted the non-empty phases[]
    clause the implementation has, so as written a zero-phase run passed
    vacuously.
  - >-
    quickstart.md Scenario 3 claimed later phases show SKIPPED; the orchestrator
    breaks, so they are ABSENT. Its "zero Distribution Records proves FR-009
    held" check is vacuous, since that array is empty on every run.
  - >-
    plan.md claimed five artifact builds run as five parallel processes; there
    are two, because four Android variants share one Gradle invocation. It also
    claimed the Challenge tests run independently of the Kotlin stream; they are
    deliberately serialized, since both invoke Gradle on one checkout.

