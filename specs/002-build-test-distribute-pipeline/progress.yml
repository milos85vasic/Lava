defects_found_and_fixed_wave10:
  note: >-
    Found by the FIRST genuine end-to-end runs of this pipeline (T031/T058/T061),
    which is exactly what those tasks existed to surface. Five defects; the two
    highest-risk are fixed, three are characterized with reproducible recipes.
  items:
  - id: a-killed-run-finalizes-as-PASS
    severity: critical
    status: FIXED
    what: >-
      Real run 2026-08-23T10-15-30Z was killed mid-build. Its process exit code was
      honest (1, "halted at: build"). Its report.json - the artifact SC-008 tells an
      auditor to read FIRST - said outcome PASS, with phases [precondition:PASS],
      zero build_artifacts and an all-zero evidence_summary. A run that never got
      past its first phase, produced nothing, and reported success.
    root_cause: >-
      finalize_run_report's rule is (.phases|length) > 0 and all(.result=="PASS").
      The length>0 guard closes the EMPTY case. It cannot close the TRUNCATED-PREFIX
      case, because a truncated run's phases[] is a perfectly valid all-PASS list -
      merely SHORTER than the run was supposed to be. Nothing in the report
      distinguished "ran everything and passed" from "stopped after phase 1". Same
      vacuous-pass class as phase-02-test.sh's zero-Evidence-Record PASS, one level up.
    fix: >-
      Per-SCRIPT in-flight marker written into the run's own (gitignored) directory:
      mark_phase_in_flight before each phase script, clear_phase_in_flight the
      instant it RETURNS, and append_interrupted_phase_if_any on every close path,
      turning a surviving marker into an honest "<phase>: FAIL" entry. A file rather
      than a shell variable, because the orchestrator can be killed outright and a
      variable dies with the process. The report schema is additionalProperties:false,
      so this is expressed in the EXISTING phases[] field rather than by widening the
      contract - and an interrupted phase genuinely did not pass, so recording it as
      FAIL states a missing fact rather than inventing one.
    self_caught_flaw_during_the_fix: >-
      The first cut marked per-PHASE, which would have appended a phantom SECOND
      FAIL to an ordinary phase failure - claiming a phase was interrupted when it
      had actually run to completion and failed. Corrected to per-SCRIPT granularity:
      the marker means "a script is executing RIGHT NOW", and a script that returns
      was not interrupted whatever its exit code.
    evidence:
      unit: tests/pipeline/test_interrupted_run_never_passes.sh - 3 cases, 6 checks.
        RED reproduced the real defect verbatim ("outcome is 'PASS', expected FAIL");
        cases 2 and 3 were green BEFORE the fix, so a blanket fail-everything change
        could not pass.
      end_to_end: >-
        Real orchestrator runs against a disposable fixture. Clean -> exit 0,
        outcome PASS, exactly ONE phase entry (no phantom FAIL). Dirty ->
        exit 2, outcome FAIL, exactly ONE precondition entry (no duplicate).
        Marker file absent after a completed run.
      regression: 24 pipeline suites, all exit 0.
  - id: the-pipeline-cannot-run-twice
    severity: high
    status: UNDER ACTIVE FIX (delegated)
    what: >-
      The go test category rewrites six TRACKED .lava-ci-evidence/stress-chaos/
      jackett/*.json files on every run. They are not gitignored (git check-ignore
      and git ls-files both confirm), so a successful run dirties the tree and the
      NEXT invocation is refused by FR-000 with exit 2. Proven decisively:
      successful run 10-17-26Z, then refusal 10-31-21Z.
    impact: >-
      Falsifies quickstart Scenario 5's explicit claim that "everything the first run
      produced is gitignored", and blocks FR-018 and SC-007. A pipeline that can only
      run once is not a pipeline.
  - id: kill-TERM-not-honoured-mid-build
    severity: medium
    status: CHARACTERIZED, not fixed
    what: >-
      Bash defers trap handlers while blocked in the foreground
      `phase-01-build.sh | tee` pipeline, so quickstart Scenario 5's CORRECTION 2
      ("kill -TERM produces a finalized report") does not hold within 60s. The
      verifying agent had to escalate to process-group TERM then KILL.
