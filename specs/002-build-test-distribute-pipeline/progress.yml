defects_found_and_fixed_wave9:
  note: >-
    Found by extending the static guard with three new checks (D: a success literal
    presented as a read value; E: ${#VAR} where BYTES are claimed; F: grep -q on the
    right-hand side of a pipe under pipefail). Three further candidate shapes were
    REJECTED as not reliably detectable, on measurement rather than opinion - see
    rejected_shapes below. CHECK F alone found 5 real sites.
  items:
  - id: anti-bluff-validator-rule-4-decided-by-FILE-SIZE-not-by-the-marker
    severity: high
    file: scripts/pipeline/lib/anti-bluff-validate.sh:344
    what: >-
      Rule 4 (a real-device-challenge record must carry a FALSIFIABILITY REHEARSAL
      marker) ran `printf '%s' "$combined" | grep -qE …`. grep -q exits the instant it
      matches, closing the pipe; printf then takes SIGPIPE and exits 141; under
      set -o pipefail that 141 IS the pipeline's status, and `if !` inverts it into
      "marker not found". $combined is the record's ENTIRE raw_output_ref, and
      real-device-challenge logcats in this repo run 1.4 MB - 5 MB. The rule was
      therefore decided by FILE SIZE rather than by the marker.
    direction: >-
      FAILS CLOSED, not open - it REJECTED records that genuinely carried their
      marker. No bluff slipped through because of it. But it would have rejected
      legitimate real-device evidence at gate time, which is its own kind of broken.
    physical_evidence: >-
      The identical marker at line 1 of a 25-byte file was FOUND; of a 2 MB file, NOT
      FOUND. Measured independently of the reporting agent, in a throwaway shell
      running the same construct under the same shell options.
    fix_evidence: >-
      After switching to a herestring: a real Evidence Record with a 2,016,748-byte
      raw log carrying the marker validates (exit 0, anti_bluff_status "validated");
      the SAME record with the marker removed from the same-size log is still
      REJECTED (exit 1) - so the fix is not an over-correction.
  - id: phase-06-docs-export-verification-same-shape-dangerous-direction
    severity: medium
    file: scripts/pipeline/phase-06-docs.sh:497,500
    what: >-
      Same SIGPIPE shape, but the DANGEROUS direction: a 141 makes the `if` false, the
      _fail is skipped, and the phase claims the export was regenerated while
      --check-only still reports it stale. Latent today only because CHECK_OUTPUT is
      small (measured at 66 bytes) - the shape is the defect, not the current size.
  - id: two-further-piped-grep-q-sites
    severity: low
    files: scripts/pipeline/phase-02-test-challenge.sh:414, phase-04-live-verify-api-app.sh:383
    what: Same shape on env-var override lists; practically bounded, latent. Fixed anyway.
  rejected_shapes:
    shape_2_cause_contradicted_by_exit_code: >-
      Rejected: the discriminating signal is control flow, not syntax. Two LEGITIMATE
      justification patterns are syntactically identical to the illegitimate one -
      release-canary justifies its SKIPPED from `[[ $exit_code -eq 2 ]]`, while
      stress-chaos correctly justifies its SKIPPED from the harness's own ran/status
      fields and never looks at an exit code at all.
    shape_4_zero_iteration_loop: >-
      Rejected on measurement: 17 of 42 array loops in scope have no ${#ARR[@]} test
      and nearly all are correct - FAILURE_REASONS and rejected_records are SUPPOSED
      to be empty on a good run.
    shape_5_or_true: >-
      Rejected on measurement: narrowed to git/cp/mv/mkdir it matches exactly 2 sites,
      both best-effort provenance copies where the original stays authoritative. Zero
      true positives, so the check would ship as pure noise.
  guard_left_red_deliberately_then_fixed_properly: >-
    The agent that added CHECK F ended with the guard RED at exit 1 on its 5 findings,
    and said so plainly rather than reaching for a green light. Its reasoning is worth
    preserving: the only ways to make it green were to delete the check that had just
    proven a live bug, or to annotate away findings it was explicitly forbidden to
    annotate - and a green light bought by deleting the check that found the bug is
    precisely the vacuous pass the file exists to prevent. It introduced ZERO false
    positives. The conductor then fixed all 5 underlying sites, and the guard is green
    legitimately: 21 suites, all exit 0.
  bug_the_agent_found_in_its_own_check: >-
    CHECK F's first draft matched `cmd || grep -q` - a logical OR with no upstream
    writer - and flagged CHECK A's own herestring lines. Corrected to require a real
    pipe, which also fixed a false NEGATIVE on `|& grep -q`. Found in self-review,
    before shipping.

