      While rehearsing a mutation of the orchestrator's "--skip precondition"
      refusal, that guard stopped refusing, so the run fell through to the DEFAULT
      --until live_verify and began a REAL Gradle build against the REAL
      repository, which had to be killed at a 2-minute timeout. A guard-regression
