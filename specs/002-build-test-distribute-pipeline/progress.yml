  - id: K-3-zero-testcases-parsed-exits-zero
    what: Reports present, zero <testcase> parsed, exit 0 with zero records.
  - id: H-1-empty-enumeration-passes
    what: Suite enumeration matching nothing runnable reported exit 0 with zero
