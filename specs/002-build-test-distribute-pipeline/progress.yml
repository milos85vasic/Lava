      asserted that a source agreed when that source had produced nothing.
    fix: FAIL when either source is absent, naming which; test_passed read from the row.
  - id: F4-F5-phase-06-no-op-guard-claim-was-false
    severity: high
    what: >-
      The claim that phase-06 "already guards the exporter-exits-0-but-does-nothing
      case" did not hold. A stubbed exporter exiting 0 and writing nothing produced
      PASS, exit 0, zero .html/.pdf on disk, and a record asserting the siblings were
      verified. Its --check-only exit code was never captured at all, so an upstream
      rename (exit 2 + usage line, grep matching nothing) also passed. On
      --skip-exports the record read, in one sentence, "skipped (--skip-exports);
      every changed .md was re-checked".
    fix: First-hand on-disk sibling check, --check-only exit-code guard, and the
      export claim built from what actually happened.
  - id: F7-challenge-wrapper-laundered-a-successful-exit-into-a-blocked-SKIPPED
    severity: high
    what: >-
      A matrix script exiting 0 with no attestation was classified SKIPPED claiming
      "BLOCKED (real, specific precondition gap)" - a cause the tool's own success
      code contradicts - and SKIPPED does not block the phase. Same laundering shape
      as the release-canary R-A defect.
    fix: rc-aware classification (documented blocked codes -> SKIPPED; 0 or
      undocumented -> FAIL, quoting the code and asserting no cause).
  - id: F1-F2-F6-remaining
