defects_found_and_fixed_wave2:
  - id: gate-sweep-wrapper-was-dead-code
    found_during: T028
    severity: high
    what: >-
      scripts/pipeline/phase-02-test-constitutional-gate-sweep.sh was fully
      implemented and functional but had NO _dispatch line in phase-02-test.sh.
      The constitutional-gate-sweep category was silently absent from every run
      - not skipped-with-a-reason, just missing - while the run summary read as
      complete. The tolerate-absence path documented in that file's header did
      NOT cover it: that path protects a category whose _dispatch line exists but
      whose script file does not.
    fix: >-
      Added GATE_SWEEP_WRAPPER plus its _dispatch call to the first (non-Gradle)
      parallel group. Proven to fire by an isolated run through the file's own
      PHASE02_GATE_SWEEP_WRAPPER override against a marker-writing stub, which
      confirmed the documented argument order reaches the wrapper.
  - id: jq-slash-slash-erases-boolean-false
    found_during: T028
    severity: medium
    what: >-
      jq -r '.all_passed // "unknown"' falls back not only on null/missing but
      also on boolean false, so an attestation saying "all_passed": false was
      recorded in every Evidence Record as "unknown" - erasing the
      did-not-all-pass signal on exactly the runs where it matters.
    fix: >-
      Explicit has(...) and != null form that still distinguishes genuinely-absent
      from present-and-false. Unit-verified false/true/null/{} mappings. Sibling
      count fields unaffected (jq treats 0 as truthy - verified, not assumed).
  - id: phase-02-passes-on-zero-evidence
    found_during: T028 follow-up
    severity: high
    what: >-
      phase-02-test.sh's PASS policy had three conditions, all of which are
      satisfied VACUOUSLY when every dispatched wrapper exits 0 without writing
      anything. Such a run reported "PASSED - all 1 dispatched wrapper(s) exited
      0, 0 Evidence Records scanned". The file's own header states the governing
      principle ("an empty test phase proves nothing") but enforced it only for
      the zero-WRAPPERS case, not the zero-EVIDENCE case that actually reaches
      the aggregator.
    red_evidence: >-
      "FAIL: zero Evidence Records -> exit 0. A test phase that scanned no
      evidence at all reported success."
    fix: >-
      Fourth PASS condition requiring at least one Evidence Record scanned, plus
      an explanatory failure message. New hermetic suite
      tests/pipeline/test_phase_02_aggregation.sh (3 cases) driving the real
      aggregator through its own override hooks. Cases 1 and 3 stayed green
      throughout, so the fix is not a blanket fail-everything.

blocking_findings_for_operator:
  - id: firebase-distribute-combined-mode-ships-release-on-debug-evidence
    severity: high
    pre_existing: true
    introduced_by_this_feature: false
    what: >-
      Verified verbatim in scripts/firebase-distribute.sh: --debug-and-release
      sets MODE="both" (line 56); the §6.AA staging gate is guarded on MODE ==
      "release" (line ~204) so it never evaluates; and AK_CHANNEL resolves to
      "debug" for any mode other than exactly "release" (line ~322). A combined
      distribute therefore ships the R8-minified RELEASE APK while the only
      device-evidence gate that runs checks DEBUG-channel evidence. This is
      mechanically the same setup as the 1.2.19-1039 incident (the §6.Z forensic
      anchor).
    impact_on_this_feature: >-
      T043 was specified to invoke exactly --debug-and-release and would have
      inherited the hole. Its design must either drive the two stages separately
      (--debug-only then --release-only, which does evaluate both gates on the
      correct channels) or land alongside a fix to the channel resolution.
    action: OPERATOR DECISION REQUIRED. Not patched autonomously - changing a live
      distribution gate's semantics is outside what this session should decide.
    reproduction_harness: tests/firebase/repro_mode_both_channel_gap.sh
    reproduction_method: >-
      scripts/firebase-distribute.sh is NEVER executed (that would attempt a real
      Firebase upload). The harness greps the script's four real decision lines
      verbatim, evaluates that extracted logic per MODE, and fails loudly (exit 2)
      if those lines ever stop existing, rather than silently testing a stale copy.
    reproduced_output: |
      MODE       | release APK sent | §6.AK channel | §6.AA staging gate
      -----------+------------------+---------------+-------------------
      debug      | no               | debug         | no
      release    | yes              | release       | yes
      both       | yes              | debug         | no
    control_case: >-
      The `release` row is the control that proves this is not a false alarm:
      --release-only DOES evaluate both gates on the correct channel. The gap is
      specific to the combined mode - which is precisely the mode an unattended
      pipeline would use.
    real_line_numbers: >-
      firebase-distribute.sh:56 (MODE="both"), :204 (§6.AA guard tests MODE ==
      "release"), :322-323 (AK_CHANNEL case, default "debug"), :435/:444/:513
      (release APK asserted, resolved and uploaded when MODE is release OR both).
    harness_exit_semantics: >-
      Inverted on purpose and documented in its header - 0 means the gap was
      REPRODUCED (expected today), 1 means it is GONE and the harness should be
      converted into a proper regression test, 2 means extraction failed and it
      can say nothing truthful. Exit 2 is never read as "fixed".

defects_found_and_fixed_wave6:
  items:
  - id: repro-harness-would-have-been-counted-as-passing-coverage
    severity: medium
    found_during: >-
      Adding the reproduction harness above - by checking, before trusting, which
      suites enumerate tests/.
    what: >-
      tests/firebase/run_all.sh globs test_*.sh, so a repro_* file is outside its
      reach. But scripts/pipeline/phase-02-test-hermetic.sh enumerates ALL *.sh at
      depth 2 (`find tests -mindepth 2 -maxdepth 2 -name '*.sh'`), so it WOULD have
      run the reproduction harness as a hermetic suite. Because that harness exits
      0 when it successfully reproduces a defect, the pipeline would have minted a
      PASS Evidence Record whose real meaning is "a known bug is still broken".
    why_it_matters: >-
      Strictly worse than the redundant-aggregator case that wrapper's own header
      already guards against: that one over-counts real coverage, this one would
      manufacture coverage out of a known failure.
    fix: >-
      Exclusion rule 3 in the hermetic wrapper - `-not -name 'repro_*.sh'` - with
      the reasoning documented alongside the two existing rules. Proven by
      enumeration count going 1 -> 0 for repro files; the wrapper still enumerates
      69 real suites, its own hermetic test passes, and tests/firebase/run_all.sh
      remains 8/8.


defects_found_and_fixed_wave3:
  note: >-
    Found by a SYSTEMATIC hunt for one defect class - the "vacuous pass", a gate
    whose success conditions are all satisfied by the ABSENCE of the thing it is
    supposed to check. The hunt was commissioned only after the same shape had
    appeared four separate times by accident. It found three more, including the
    single deepest defect in the feature.
  items:
  - id: anti-bluff-validator-was-itself-bluffable
    severity: critical
    found_during: systematic vacuous-PASS audit
    what: >-
      Every one of anti-bluff-validate.sh's four rules was satisfied by a record
      carrying NO evidence. An empty assertion_summary contains none of rule 1's
      bluff phrases. An empty raw_output_ref resolves to the record's OWN
      DIRECTORY, and both [[ -e dir ]] and [[ -s dir ]] are TRUE for a directory
      (its inode has non-zero size), so rules 2 and 3 passed on nothing. An empty
      category is not "real-device-challenge", so rule 4 was skipped. And
      jq -r '.x // empty' exits 0 for an ABSENT field, so rule 0's guard never
      fired despite its header claiming to reject records missing required
      fields. Reachable through the PRODUCTION writer, not only hand-edited JSON:
      any wrapper passing its raw directory instead of a captured-output file.
    why_it_matters: >-
      This component is the one FR-004 relies on to catch a test lying about
      itself. A bluffable anti-bluff validator makes every downstream "validated"
      stamp in the pipeline unfalsifiable.
    fix: >-
      Rule 0c (every schema-required field present AND non-empty, checked BEFORE
      any rule an empty value would satisfy), rule 0d (category must be one of
      the 8 enum values), rule 2 tightened from -e to -f with a distinct message
      for the directory case. New suite test_anti_bluff_missing_evidence_fields.sh
      (8 checks incl. 3 over-correction guards). Independently re-verified by the
      orchestrating session; the ORIGINAL validator suite still passes.
  - id: phase-01-records-artifacts-not-on-disk
    severity: high
    what: >-
      cp -f ran with its exit status unchecked, then ARTIFACT <label>: <dst> was
      printed unconditionally and return 0. phase-01-build.sh believed the line,
      recorded the path and incremented its counter without checking the record
      call's own result. Proven with a read-only destination: "cp: cannot create
      regular file ...: Permission denied" immediately followed by "ARTIFACT
      app-debug: ...", then "all 5 Build Artifacts produced and recorded",
      PHASE EXIT=0 - while the recorded path did not exist. phase-02-test.sh
      resolves the release-canary APK out of exactly that array.
    second_defect_same_run: >-
      Build Artifact metadata (version, commit) was read from REPO_ROOT while the
      sub-builders built from the [repo-path] override, so an artifact built from
      a fixture at 9.9.9 was recorded as 1.3.17/1086.
    fix: >-
      cp status checked plus post-copy -f/-s verification; each declared path
      verified real and non-empty before recording; only successful records
      counted, unverified ones folded into the verdict; metadata read from the
      same path the build used. New suite test_phase_01_artifact_verification.sh.
  - id: phase-04-passes-on-empty-response-body
    severity: high
    what: >-
      The script's own header says it exists to prove the service answers with
      REAL, meaningful response bodies rather than merely being "Up" (§6.B). The
      per-request verdict used curl's exit code and a 2xx match only; the body was
      read, truncated, interpolated into assertion_summary, and never asserted on.
      Doubly vacuous - anti-bluff rule 3 ("raw_output_ref non-empty") was satisfied
      by scaffolding lines the script itself writes into the raw file. Proven
      against a real TLS server returning 200 with a zero-byte body: 3 records all
      "validated", phase PASS, exit 0, summary ending "response body: " with
      nothing after the colon.
    fix: >-
      Whitespace-stripped empty body now fails the request with a specific reason.
      Over-correction guarded by pinning the three endpoints' real bodies, read
      from internal/observability/health.go and internal/router/router.go. New
      suite test_phase_04_live_verify_response_body.sh.

undemonstrated_hypotheses:
  note: Reported as hypotheses, NOT findings, because they were not reproduced.
  items:
  - phase-01-build.sh counts ARTIFACT lines rather than distinct labels, so five
    duplicates would satisfy ">= 5". Not reachable through the real sub-scripts,
    each of which prints a given label at most once.
  - recompute_evidence_summary's `find ... 2>/dev/null` would report zero records
