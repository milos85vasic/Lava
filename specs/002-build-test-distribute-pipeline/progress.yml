defects_found_and_fixed_wave8:
  note: >-
    Two bugs in the static guard itself - the component whose entire purpose is to
    stop this defect family from recurring. Both found within minutes of each other,
    the second introduced by the fix for the first.
  items:
  - id: scanner-CHECK-A-false-negative
    severity: high
    found_by: the four-script audit, which hit the exact case the guard was blind to
    what: >-
      CHECK A's "is this variable ever compared?" test searched the whole file
      including its echo/printf lines, and accepted a bare `[` as evidence of a test
      context. A reporting line like `echo "wrapper [${label}] exited ${rc}"`
      therefore satisfied it - the `[` of the label matched - so a variable that had
      only ever been PRINTED counted as compared. That is precisely the defect the
      check exists to find, so the guard was blind to its own target. Real instance:
      phase-02-test-challenge.sh captured `local rc=$?`, echoed it three times, never
      compared it, and the scanner reported the file clean.
    fix: Strip echo/printf lines from the haystack before looking for a test context.
    falsifiability_proven: >-
      Injected the exact shape (captured, echoed with a bracketed label, never
      compared) into phase-00-precondition.sh; CHECK A flagged it
      ("$PROBE_RC captured, never compared"); reverted byte-identically; green again.
  - id: scanner-SIGPIPE-false-positive-introduced-by-that-fix
    severity: medium
    what: >-
      The first version of the fix piped `grep -v … | grep -q …`. grep -q exits the
      moment it matches, closing the pipe; the upstream grep -v still has output to
      write, takes SIGPIPE and exits 141. Under set -o pipefail the pipeline's status
      IS that 141, so a SUCCESSFUL match was reported as failure. Two genuinely
      compared variables were flagged as never-compared - MATRIX_RC at
      phase-04-live-verify-api-app.sh:506 and rc at phase-06-docs.sh:198, both plainly
      inside `if [[ … -eq … ]]`. Measured directly: both branches returned 141.
    diagnostic_note: >-
      The first hypothesis for this was tested and found WRONG (an early-matching
      probe returned 0 because its output fit the pipe buffer). Only instrumenting
      each branch and reading the actual 141 identified the cause. The wrong
      hypothesis was discarded on evidence rather than acted on.
    irony_worth_recording: >-
      A check for "an exit code was captured and never examined" was defeated by an
      exit code it did not examine closely enough.
    fix: No pipelines - the filtered haystack is precomputed once per file into a
      variable, so there is no upstream process left to signal.

