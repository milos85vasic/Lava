lva_120_investigation:
  when: "2026-08-23"
  mandate: operator chose "Investigate further first" over either remedy
  correction_to_the_original_finding:
    what_was_overstated: >-
      The finding was reported (including twice to the operator) as "the only
      device-evidence gate that runs checks DEBUG-channel evidence while the
      RELEASE APK ships" - implying release evidence was skipped in favour of
      different, weaker evidence.
    what_is_actually_true: >-
      --channel is INERT in scripts/check-cycle-coverage.sh. CHAN appears only at
      init (:32), parse (:37-38) and a non-empty assertion (:51). It never resolves
      a path nor alters a check; both artifacts resolve from $EDIR+$VER alone
      (:61, :72). Zero eval / ${!…} / declare -n, so it cannot be smuggled in.
      Confirmed independently by the conductor. The artifacts on disk are
      per-VERSION with no debug/release split to select between
      (cycle-coverage-map-1.3.17-1085.yaml). So AK_CHANNEL=debug vs release makes
      ZERO behavioural difference today - the gate checks the same two files either
      way, and fixing the channel alone would refuse nothing.
    the_live_half: >-
      The §6.AA staging gate at firebase-distribute.sh:204, guarded on
      MODE == "release", never evaluates for `both`. That removes the verification
      INTERVAL between shipping debug and shipping release - which is the entire
      mechanism §6.AA clauses 1-2 exist to create, and precisely what bit 1.2.19-1039.
  usage_history_established_from_the_scripts_own_logs:
    method: >-
      firebase-distribute.sh writes mode=$MODE into a per-run log (:521-529). 32 such
      logs survive on disk (gitignored via .gitignore:93). Primary evidence, not
      inference.
    both_runs: 11, every one of them BEFORE 2026-05-14, last at 1.2.16-1036
    crucial_distinction: >-
      "Used" does NOT mean "used via the flag". Before commit 964b19d7
      (2026-05-14) the script read MODE="${1:-both}" - `both` was the DEFAULT, and
      the --debug-and-release|--both alias DID NOT EXIST; that same commit added the
      alias, flipped the default to debug, AND added the :204 gate. So all 11 runs
      came from a bare invocation, not from typing the flag.
    the_flag_has_never_been_invoked: >-
      No wrapper, Makefile or script has ever passed it. scripts/distribute.sh
      structurally cannot: its arg loop silently drops unknown args (:64), so
      `distribute.sh --debug-and-release` degrades to a no-flag call -> MODE=debug.
      scripts/pipeline/phase-05-distribute.sh does not exist (T043 unchecked). Every
      other hit is documentation - including docs/deployment/README.md:201, which
      already labels it "legacy combined (NOT recommended)".
  1_2_19_1039_explained: >-
    CONFIRMED by four mutually corroborating sources: (1) at that date the script
    read MODE="${1:-both}", so a bare invocation ran `both`; (2) the fix commit
    964b19d7, same day, states in-code that §6.AA was birthed by the
    "1.2.19-1039 forensic anchor: combined distribute pushed both debug + release
    before any device verification"; (3) the distribute commit 46879058's own
    subject says "both APKs distributed"; (4) CLAUDE.md:898. Refinement that matters:
    it was reached via the old DEFAULT, and 964b19d7 already closed that exposure.
  why_remedy_b_collapses:
    ak_half: a no-op, per the correction above
    aa_half_naive: >-
      Makes --debug-and-release permanently unusable for every new versionCode
      (no debug stage has run for it yet), via a message that literally says
      "--release-only invoked for versionCode N" - wrong for a `both` invocation.
      Functionally identical to retiring the flag, reached by a confusing error.
    aa_half_careful: >-
      Treating the in-run debug upload as satisfying stage 1 passes the gate but
      delivers NO staging protection: the two stages would occur milliseconds apart
      with no operator verification between them. That interval IS the mechanism.
  remedy_a_verified_working: >-
    Traced against the real current pointers (client debug/release both 1085) for
    N=1086: --debug-only passes §6.P and skips :204 (MODE != release), advancing
    last-version-debug to 1086; --release-only then passes :204 because it tests
    `>` not `>=`. Every distribute since 2026-07-03 is a clean debug->release pair
    in the surviving logs, and pointer-commit splits show the practice back to 1044.
  real_trap_found_worth_its_own_item: >-
    §6.Y vs §6.AA interact badly. §6.Y mandates a versionCode bump after EVERY
    successful distribution, and stage 1 IS a successful distribution. Bump
    1086->1087 between stages and stage 2 hits `1087 > 1086` -> FATAL §6.AA, with
    release for 1087 unreachable until a fresh debug stage runs. Pre-push Check 6
    actively pushes toward that bump. Consequence for any automated caller: both
    stages must run against the SAME SHA, with no bump and no code change between,
    inside the 24h evidence-freshness window.
  recommendation_for_the_operator: >-
    Retire the flag rather than gate it - remove the alias at :56 so MODE=both
    becomes unconstructible. That closes the hole instead of leaving it merely
    unreachable, converts tests/firebase/repro_mode_both_channel_gap.sh to its
    documented exit-1 "gap GONE" signal, and lets that harness become a standing
    regression test. OPERATOR DECISION - not taken autonomously.
  still_unknown:
    - "UNCONFIRMED: the mode used for cycles 1045-1049, 1056, 1057, 1061, 1062, 1076
       - their three pointers advanced in a single commit, which cannot be
       distinguished from two back-to-back stages. Their commit subjects assert
       two-stage. What would settle it: the mode= line in those logs, no longer on disk."
    - "UNKNOWN: whether check-cycle-coverage.sh's --channel was intended to be
       load-bearing and left unimplemented, or is deliberately decorative. Its header
       documents it as '(required) e.g. debug | release', which reads as intent. This
       decides whether the §6.AK half is a latent bug worth fixing or a dead parameter
       worth deleting - a separate decision from LVA-120."

evidence_integrity_corrections:
  note: >-
    A record-keeping pass RE-MEASURED every finding before writing it down, and
    corrected six things in the brief it was given. This is the anti-bluff
    discipline working in the direction that matters most - against material this
    session had already accepted and relayed.
  items:
  - id: F3-quoted-output-provenance-mislabelled-then-OVER-corrected
    severity: medium
    what: >-
      The §6.N.2 hunt reported F3 with output reading as gate output - "CASE B:
      EXAMINED=5 ... GATE RESULT: PASS EXIT=0". A record-keeping pass noted the
      strings occur nowhere under scripts/ and withdrew the framing. The conductor
      confirmed that grep result and then OVERSTATED the conclusion to the operator,
      calling the output "illustrative, not captured" - i.e. implying fabrication.
    the_actual_truth: >-
      The output WAS captured. EXAMINED and GATE RESULT are printed by the TEST
      HARNESS, which wraps the verbatim-extracted propagation block with its own
      instrumentation (tests/check-constitution/test_propagation_target_floor.sh
      lines 77-78 generate those echo statements around the extracted code). The
      independently-written second harness produces the identical strings. So the
      earlier output was genuine harness output, produced by the same legitimate
      extract-and-instrument technique this project uses throughout. What was
      actually wrong was only the LABEL: harness output presented as gate output.
    substance_confirmed_twice: >-
      The defect is real, and was independently re-verified by two separate agents:
      22 submodule CLAUDE.md files against 5 hardcoded propagation targets
      (check-constitution.sh:241-244) with no floor on the extending glob. The
      mechanism was measured rather than assumed - the failing [[ -f ]] is the
      non-final operand of an && list, which `set -e` exempts, so the script
      continues instead of aborting. FIXED (+30/-1) with a zero-count floor.
    lesson_corrected: >-
      The first lesson drawn from this ("a finding can be true and its evidence
      still fabricated") was itself an over-correction, and is withdrawn. The real
      lesson is narrower and more useful: distinguish WHERE captured output came
      from. Harness output and gate output are both genuine evidence; conflating
      them misleads, and so does treating a mislabel as a fabrication. A grep
      returning no match proves the string is not in that file - it does not prove
      the output was invented.
  - id: F1-has-a-fifth-affected-site
    what: >-
      The pre-push SIGPIPE finding was reported at lines 63/135/167/210. There is a
      FIFTH at line 137 (`grep -qF 'app/build.gradle.kts'`), confirmed by direct
      inspection. An under-count in a security-relevant finding.
  - id: F1-sub-threshold-numbers-not-reproducible
    what: >-
      The reported sub-threshold split (70,918 B -> REJECT 3 / ALLOW 7; f1a2c362 ->
      FOUND 1 / MISSED 19) did not reproduce; re-measurement gave 0/10 and 0/20.
      It is a scheduling race. Only the DIRECTION and the >=65,536-byte certainty
      are stable. Both figures are recorded unreconciled rather than one being
      quietly dropped.
  - id: three-smaller-corrections
    what: >-
      CLAUDE.md's pins-frozen line is 301, not 299, in the current file. `validate`
      alone exits 1 (67 pre-existing ledger-exempted rows), not 0 - the GATE exits 0
      because the ledger is a per-(atm_id, history_id) allowlist rather than a count
      pin, so new items cannot disturb it. The export-sync baseline was 2 problems,
      not 0, from stale CLAUDE exports.
  - id: guard-false-positive-reproduced-live
    what: >-
      The over-broad matcher in scripts/hooks/guard-forbidden-commands.sh:208
      (`git([[:space:]]+[^[:space:]]+)*[[:space:]]+push`, unanchored, spanning
      arbitrary tokens) BLOCKED the writing of the bluff-hunt evidence file - because
      that file's own prose describing the matcher contains `git`, `push` and
      `rm -f`. Verbatim: `guardrails: BLOCKED — §6.T.3 force-push`. The agent routed
      around it with a different tool rather than weakening the guard, which is the
      correct response - but it is now the fourth benign write this guard has
      blocked, and a safety guard that trains people to route around it is losing
      the property it exists to provide.

