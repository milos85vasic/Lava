    So the §6.H blocker that failed the FIRST T061 run is genuinely gone - it got
    four gates further this time.
  the_race: >-
    tests/check-constitution/test_covenant_114_propagation.sh DELIBERATELY mutates
    root CLAUDE.md during its falsifiability probe and restores it. Two such
    processes were running when ci.sh read the file. Confirmed by waiting for them
    and re-checking: CLAUDE.md is intact (11.4.134 present, zero placeholders), so
    the kill-safe trap is working and nothing is corrupted.
  the_real_hazard_this_exposes:
    severity: medium
    what: >-
      A test that mutates a SHARED REPOSITORY FILE cannot safely run concurrently
      with anything that reads it. With several parallel streams each running full
      sweeps, any gate invocation overlapping that probe sees a broken CLAUDE.md and
      reports a violation that does not exist. This has now produced one
      misattributed "stray agent edit" diagnosis and one inconclusive T061 run.
    options: >-
      Give the probe a lock other readers respect; or have it operate on a COPY and
      point the gate at that copy via an env override; or serialise it out of
      parallel sweeps. All three are design changes to a test, not to a gate.
