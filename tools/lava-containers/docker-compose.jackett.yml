# Lava Jackett-sidecar compose fragment.
#
# Adds a Jackett (Torznab indexer proxy) + FlareSolverr (Cloudflare-challenge
# solver, needed for IPTorrents) service set to the Lava local stack. Neither
# port is published to the LAN — both bind to the host loopback (127.0.0.1)
# only, matching the root compose's lava-postgres / observability pattern. The
# Android app continues to see exactly ONE endpoint (`_lava-api._tcp` =
# lava-api-go); lava-api-go proxies Torznab server-side and holds the Jackett
# api_key (§6.H). The app never talks to Jackett directly.
#
# Topology (from docs/qa/jackett-local-stack-research.md §"Recommended topology"):
#
#   Android app ──mDNS(_lava-api._tcp)──▶ lava-api-go (:8443, host-net, TLS+HMAC)
#                                              │  (server-side HTTP, holds api_key)
#                                              ▼
#                                  127.0.0.1:9117  →  lava-jackett   (NOT advertised)
#                                              │
#                                (only when profile=cloudflare)
#                                              ▼
#                                  127.0.0.1:8191  →  lava-flaresolverr
#
# WHY 127.0.0.1-loopback publish (not bridge `expose:` only):
#   lava-api-go runs `network_mode: host` (mDNS requires host net). A host-net
#   container CANNOT resolve the bridge DNS name `lava-jackett`, and a
#   bridge-only `expose: 9117` port is NOT reachable via
#   `host.containers.internal`. Publishing to 127.0.0.1 makes Jackett reachable
#   from BOTH the host-net lava-api-go (`http://127.0.0.1:9117`) AND a host-side
#   validation curl, while keeping it off the LAN (loopback bind, not 0.0.0.0).
#   This is the same security posture lava-postgres uses (`127.0.0.1:8432:5432`).
#   => set LAVA_API_JACKETT_URL=http://127.0.0.1:9117 in .env for this stack.
#
# Profiles:
#   jackett     — brings up lava-jackett only.
#   cloudflare  — additionally brings up lava-flaresolverr (RAM-heavy Chromium;
#                 keep OFF for RuTracker/RuTor/NNMClub-only sessions).
#
# §6.R no-hardcoding: images, the api_key, the loopback bind host, and tracker
# credentials are NOT literals here. They come from the gitignored .env
# (placeholders in .env.example). The env var names are EXACTLY the ones
# lava-api-go reads (lava-api-go/internal/config/config.go):
# LAVA_API_JACKETT_APIKEY / LAVA_API_JACKETT_URL — so one .env value drives
# both the container healthcheck AND the Go service; there is no parallel name
# set to drift. The Jackett api_key is generated on first run into the
# gitignored /config volume's ServerConfig.json; it is NEVER committed and
# NEVER sent to the device.
#
# §6.B readiness: the healthcheck is a Torznab `t=caps` probe (HTTP 200 +
# parseable body), NOT a bare TCP-9117 check. "Up" != "application-healthy";
# a caps probe proves the Torznab surface is live AND the api_key is valid —
# the same code path lava-api-go consumes. `start_period` is generous to cover
# the .NET runtime + indexer-def cold-load (UNCONFIRMED cold-start seconds per
# the dossier — tighten once measured on the target host).
#
# DO NOT bring this file up directly — orchestration is owned by
# tools/lava-containers/cmd/lava-containers. Merge with the root compose via:
#   docker compose -f ../../docker-compose.yml -f docker-compose.jackett.yml \
#     --profile api-go --profile jackett config
# Or validate end-to-end via scripts/validate-jackett-sidecar.sh.
#
# Verify parse before use: `docker compose -f docker-compose.jackett.yml config --quiet`.

services:

  # Profile: jackett ---------------------------------------------------------
  lava-jackett:
    profiles: [jackett, cloudflare]
    # Multi-arch (amd64 + arm64v8) LinuxServer image. Pin by DIGEST in .env for
    # reproducibility; .env.example carries a placeholder.
    image: ${LAVA_JACKETT_IMAGE:-lscr.io/linuxserver/jackett:latest}
    container_name: lava-jackett
    networks: [lava-net]
    # Published to LOOPBACK ONLY (127.0.0.1) — reachable by the host-net
    # lava-api-go and by a host-side validation curl, but NOT on the LAN.
    # The WebUI/admin surface stays off the network. The host-side port is
    # configurable (default 9117) so it can be moved if 9117 is taken.
    ports:
      - "${LAVA_JACKETT_BIND_HOST:-127.0.0.1}:${LAVA_JACKETT_HOST_PORT:-9117}:9117"
    environment:
      PUID: "${LAVA_JACKETT_PUID:-1000}"
      PGID: "${LAVA_JACKETT_PGID:-1000}"
      TZ: "${LAVA_JACKETT_TZ:-Etc/UTC}"
      # Auto-update disabled: we pin the image by digest and treat /config as a
      # secrets store; in-container self-update would drift the pin.
      AUTO_UPDATE: "false"
    volumes:
      # /config holds ServerConfig.json (api_key) + per-indexer creds. This host
      # path MUST be gitignored — it is a §6.H secrets store. The Containers glue
      # owns its lifecycle; it is never committed, never logged.
      - "${LAVA_JACKETT_CONFIG_DIR:-./.jackett-config}:/config"
    healthcheck:
      # §6.B-correct: Torznab caps probe. wget is present in the Alpine-based
      # lscr image. The api_key is injected from the same /config secret so the
      # probe also validates auth, not just liveness. A 200 + non-empty body is
      # required; `--spider` alone would accept a 200 on `/` (a bluff probe), so
      # we fetch to a discardable target and let a non-zero wget exit fail it.
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null \"http://127.0.0.1:9117/api/v2.0/indexers/${LAVA_API_JACKETT_DEFAULT_INDEXER:-all}/results/torznab/api?t=caps&apikey=${LAVA_API_JACKETT_APIKEY:?LAVA_API_JACKETT_APIKEY required for healthcheck}\""
      interval: 15s
      timeout: 10s
      retries: 6
      # Cold-start allowance for the .NET runtime + indexer-def load.
      start_period: 40s
    restart: unless-stopped

  # Profile: cloudflare ------------------------------------------------------
  # Only up when an indexer that needs a Cloudflare/DDoS-Guard bypass (notably
  # IPTorrents) is enabled. FlareSolverr runs a headless Chromium PER concurrent
  # challenge — the heaviest component in the stack — so it is profiled off by
  # default. Jackett is pointed at it via a FlareSolverr URL in Jackett's config
  # (http://lava-flaresolverr:8191), set at indexer-provisioning time. Jackett
  # reaches FlareSolverr over the lava-net bridge (both are bridge members), so
  # the bridge DNS name `lava-flaresolverr` resolves there; the loopback publish
  # below is only for the host-side validation curl.
  lava-flaresolverr:
    profiles: [cloudflare]
    image: ${LAVA_FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:latest}
    container_name: lava-flaresolverr
    networks: [lava-net]
    ports:
      - "${LAVA_FLARESOLVERR_BIND_HOST:-127.0.0.1}:${LAVA_FLARESOLVERR_HOST_PORT:-8191}:8191"
    environment:
      LOG_LEVEL: "${LAVA_FLARESOLVERR_LOG_LEVEL:-info}"
      HOST: "0.0.0.0"
      PORT: "8191"
      HEADLESS: "true"
    healthcheck:
      # FlareSolverr has no GET /health endpoint; sessions.list is the de-facto
      # liveness probe (POST /v1 {"cmd":"sessions.list"} → 200). A bare TCP/8191
      # check would be a bluff (the Python proxy binds before Chromium is ready).
      # NOTE: the FlareSolverr image is Python/Ubuntu-based and ships `curl` but
      # NOT `wget` (verified 2026-06-08) — using wget here left the container
      # perpetually `starting` (healthcheck exit 1: "wget: not found") even while
      # the service was serving. `curl -f` fails the check on any non-2xx status.
      test:
        - "CMD-SHELL"
        - "curl -fsS -o /dev/null -H 'Content-Type: application/json' -d '{\"cmd\":\"sessions.list\"}' http://127.0.0.1:8191/v1"
      interval: 20s
      timeout: 15s
      retries: 5
      # Chromium warm-up is slow; allow a generous first-boot window.
      start_period: 60s
    restart: unless-stopped

# `lava-net` is declared `external: true` here so this fragment composes with
# the root docker-compose.yml (which owns the bridge definition) without
# redefining it. When merged via `-f`, Docker uses the root file's `lava-net`.
# The standalone validation script (scripts/validate-jackett-sidecar.sh)
# creates this network first so the fragment can be brought up on its own.
networks:
  lava-net:
    external: true
