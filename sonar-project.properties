# sonar-project.properties — SonarQube scanner configuration for Lava.
#
# Consumed by the `sonarsource/sonar-scanner-cli` container that
# scripts/sonar-scan.sh launches against this workspace. The Sonar server is
# the local rootless stack in docker-compose.sonar.yml (127.0.0.1:9000).
#
# Reports are produced by sibling completeness-program streams:
#   Phase 2A (Detekt + Kover)  → config/detekt + Kover XML
#   Phase 2B (golangci-lint + go coverage) → lava-api-go coverage
# The report paths below are referenced even though they are generated by
# those streams; the scanner gracefully skips any report file that is absent.

sonar.projectKey=vasic-digital_lava
sonar.projectName=Lava
sonar.projectVersion=1.0

# ── Sources ────────────────────────────────────────────────────────────────
# Kotlin (Android app + core + feature modules) and Go (lava-api-go service).
sonar.sources=app,core,feature,lava-api-go

# ── Exclusions ──────────────────────────────────────────────────────────────
# Submodules are owned/governed elsewhere (Decoupled Reusable Architecture);
# releases/ + build outputs + generated code + VCS metadata are not analyzed.
sonar.exclusions=\
  submodules/**,\
  releases/**,\
  **/build/**,\
  **/.gradle/**,\
  lava-api-go/internal/gen/**,\
  **/*.gen.go,\
  .git/**,\
  .gitignore,\
  .gitmodules,\
  .gitattributes

# Keep test sources out of the main "sources" set; declare them explicitly.
sonar.tests=\
  app/src/test,\
  app/src/androidTest,\
  core,\
  feature,\
  lava-api-go
sonar.test.inclusions=\
  **/*Test.kt,\
  **/*Tests.kt,\
  **/*Test.java,\
  **/*_test.go

# ── Language scopes ──────────────────────────────────────────────────────────
sonar.kotlin.source=2.0
sonar.go.exclusions=**/*.gen.go,**/vendor/**

# ── Kotlin: Detekt findings (Phase 2A output) ────────────────────────────────
# Detekt SARIF/XML report; path is where Phase 2A writes it.
sonar.kotlin.detekt.reportPaths=build/reports/detekt/detekt.xml

# ── Kotlin: coverage (Kover → JaCoCo-format XML, Phase 2A output) ─────────────
sonar.kotlin.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=\
  build/reports/kover/report.xml,\
  app/build/reports/kover/report.xml

# ── Go: coverage (Phase 2B output) ───────────────────────────────────────────
# Phase 2B produces lava-api-go/coverage.out via `go test -coverprofile`.
sonar.go.coverage.reportPaths=lava-api-go/coverage.out

# ── Encoding / SCM ────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
