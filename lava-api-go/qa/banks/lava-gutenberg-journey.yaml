#
# HelixQA Test Bank: Lava — Project Gutenberg (gutenberg) provider journey
# Real human journey: onboard -> select Project Gutenberg (NONE auth, anonymous)
# -> search -> browse -> open result -> obtain a working HTTP e-book download.
#
# Provider facts (from core/tracker/gutenberg/.../GutenbergDescriptor.kt):
#   id=gutenberg  displayName="Project Gutenberg"  authType=NONE
#   capabilities: SEARCH, BROWSE, TOPIC
#   NO TORRENT_DOWNLOAD, NO MAGNET_LINK, NO AUTH_REQUIRED — Project Gutenberg
#   is a free e-book library (Gutendex JSON API, https://gutendex.com) and
#   serves EPUB / plain-text / HTML e-books over HTTP. The download deliverable
#   here is a working HTTP e-book file link, NOT a torrent/magnet (declaring
#   TORRENT_DOWNLOAD would be a clause-6.E bluff).
#
# Forensic note (CLAUDE.md §6.G): like the Internet Archive provider, the
# no-auth "Continue" path must short-circuit instead of hanging on a
# CircularProgressIndicator. The auth step below verifies the anonymous
# "Continue" path reaches the app instead of spinning forever.
#
# Executor contract (submodules/helixqa pkg/orchestrator/definition_challenge.go):
#   - platforms: [android] routes each case to executeAndroidVisionSteps,
#     which builds a visionnav.Target{LaunchAction, ScreenGoals} and drives
#     the real device through the vision loop.
#   - LaunchAction (deriveLaunchAction): the FIRST non-skipped `adb_shell:`/
#     `shell:` step. Every case opens with an explicit-component launch
#     (am start -n .../MainActivity) because the debug build's LeakCanary
#     registers a 2nd LAUNCHER activity, making `monkey -p <pkg>` ambiguous.
#   - ScreenGoals (deriveScreenGoals): each entry in `required_evidence`,
#     then `expected_result`. These become OCR goal substrings the vision
#     model confirms from a real screenshot.
version: "1.0"
name: "Lava — Project Gutenberg Provider Journey"
description: "End-to-end Project Gutenberg journey on the Lava Android app: onboard, anonymous (no-auth) continue, search, browse, open book, obtain a working HTTP e-book download link."
metadata:
  author: "vasic-digital"
  app: "Lava"
  application_id: "digital.vasic.lava.client.dev"
  provider_id: "gutenberg"
  provider_display_name: "Project Gutenberg"
  auth_type: "NONE"

test_cases:
  - id: LAVA-GUTENBERG-001
    name: "Onboard and select the Project Gutenberg provider"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava and reach onboarding"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "Onboarding Welcome screen is visible without a crash"
      - name: "Advance to the provider selection step"
        action: "Tap the primary continue control to reach provider configuration"
        expected: "Provider list shows Project Gutenberg as a selectable entry"
      - name: "Select Project Gutenberg"
        action: "Tap the Project Gutenberg provider entry"
        expected: "Project Gutenberg is marked selected; because auth_type is NONE no credential fields are required"
    required_evidence:
      - "Project Gutenberg"
      - "provider"
    tags: [gutenberg, onboarding, provider-selection, anonymous]
    expected_result: "The provider list is on screen and Project Gutenberg is a selectable entry that a user can choose without being asked for credentials"

  - id: LAVA-GUTENBERG-002
    name: "Continue anonymously without hanging on the loading indicator"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava (cold start)"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App cold-starts to the onboarding/welcome surface without a crash"
      - name: "Trigger the anonymous Continue path"
        action: "Select Project Gutenberg and tap the Continue control for the no-auth provider"
        expected: "The no-auth path short-circuits: the loading indicator does NOT spin indefinitely"
      - name: "Reach the main/search surface"
        action: "Wait for navigation to complete after Continue"
        expected: "The app reaches its main/search surface within a few seconds (regression guard for the historical stuck-spinner defect)"
    required_evidence:
      - "Search"
    tags: [gutenberg, auth, anonymous, regression]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "After anonymous Continue the app lands on a usable Search surface instead of a perpetual spinner"

  - id: LAVA-GUTENBERG-003
    name: "Search Project Gutenberg for a realistic query and browse results"
    category: functional
    priority: high
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit a realistic query"
        action: "Enter a realistic real-world query (e.g. the public-domain author 'Shakespeare') and submit to the live gutendex.com API"
        expected: "A result list renders with rows carrying book title and author metadata"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    required_evidence:
      - "results"
    tags: [gutenberg, search, browse]
    expected_result: "A populated, scrollable result list of Project Gutenberg books is visible on screen for the submitted query"

  - id: LAVA-GUTENBERG-004
    name: "Open a book and obtain a working HTTP e-book download link"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open a search result book"
        action: "Run a search, then tap the first result row to open its book/detail screen"
        expected: "Book detail renders with title, author and a download/file affordance"
      - name: "Locate the HTTP download affordance"
        action: "Find the file/download control (Project Gutenberg serves e-books over HTTP — there is NO torrent/magnet control for this provider)"
        expected: "A working HTTP file/download control is present and enabled; no torrent/magnet control is expected"
      - name: "Resolve the download URL"
        action: "Trigger the download; capture the resolved e-book file URL/payload"
        expected: "A reachable https e-book file URL (EPUB / plain-text / HTML) is resolved and returns a non-empty payload (HTTP 200)"
    required_evidence:
      - "Download"
    tags: [gutenberg, download, http, ebook]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "The book detail screen shows a working HTTP Download control for a Project Gutenberg e-book — the provider's primary deliverable"
