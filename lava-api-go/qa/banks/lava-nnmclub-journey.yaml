#
# HelixQA Test Bank: Lava — NNM-Club provider journey
# Real human journey: onboard -> select NNM-Club (FORM_LOGIN auth) -> search ->
# browse -> open result -> obtain a working .torrent / magnet download.
#
# Provider facts (from core/tracker/nnmclub/.../NnmClubDescriptor.kt):
#   id=nnmclub  displayName="NNM-Club"  authType=FORM_LOGIN
#   capabilities: SEARCH, BROWSE, TOPIC, COMMENTS, TORRENT_DOWNLOAD,
#                 MAGNET_LINK, AUTH_REQUIRED
#
# Credentials per §6.H / §11.4.10: NEVER inline. The authenticating step
# loads NNMCLUB_USERNAME / NNMCLUB_PASSWORD from the runtime env at execution.
version: "1.0"
name: "Lava — NNM-Club Provider Journey"
description: "End-to-end NNM-Club journey on the Lava Android app: onboard, form-login auth, search, browse, open topic, obtain torrent/magnet download."
metadata:
  author: "vasic-digital"
  app: "Lava"
  application_id: "digital.vasic.lava.client.dev"
  provider_id: "nnmclub"
  provider_display_name: "NNM-Club"
  auth_type: "FORM_LOGIN"

test_cases:
  - id: LAVA-NNMCLUB-001
    name: "Onboard and select the NNM-Club provider"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Launch Lava and reach onboarding"
        action: "Cold-start the app; wait for the onboarding/welcome surface"
        expected: "Onboarding Welcome screen is visible without a crash"
      - name: "Advance to the provider selection step"
        action: "Tap the primary continue control to reach provider configuration"
        expected: "Provider list shows NNM-Club as a selectable entry"
      - name: "Select NNM-Club"
        action: "Tap the NNM-Club provider entry"
        expected: "NNM-Club is marked selected and its form-login surface is reachable"
    tags: [nnmclub, onboarding, provider-selection]
    expected_result: "A real user can choose NNM-Club during onboarding and reach its form-login surface"

  - id: LAVA-NNMCLUB-002
    name: "Authenticate to NNM-Club with form-login credentials"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Open the NNM-Club login form"
        action: "Open the NNM-Club credential entry surface"
        expected: "Username and password fields are presented (FORM_LOGIN)"
      - name: "Enter real credentials from the runtime environment"
        action: "Type NNMCLUB_USERNAME and NNMCLUB_PASSWORD loaded from env (never hardcoded)"
        expected: "Fields accept input; no validation error before submit"
      - name: "Submit and authenticate against the real NNM-Club service"
        action: "Tap submit; wait for the network round-trip"
        expected: "Authentication succeeds; the loading indicator clears and the search surface becomes reachable (no stuck spinner)"
    tags: [nnmclub, auth, form-login, real-service]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "A real user with valid NNM-Club credentials reaches an authenticated session against the live service"

  - id: LAVA-NNMCLUB-003
    name: "Search NNM-Club for a realistic query and browse results"
    category: functional
    priority: high
    platforms: [android]
    steps:
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit a realistic query"
        action: "Enter a realistic real-world query and submit to the live tracker"
        expected: "A result list renders with rows carrying title, size and seed/leech counts"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    tags: [nnmclub, search, browse]
    expected_result: "A real user can search the live NNM-Club and see a populated, scrollable result list"

  - id: LAVA-NNMCLUB-004
    name: "Open a result and obtain a working download option"
    category: functional
    priority: critical
    platforms: [android]
    steps:
      - name: "Open a search result topic"
        action: "Tap the first result row to open its topic/detail screen"
        expected: "Topic detail renders with title, metadata and download affordances"
      - name: "Locate the download affordances"
        action: "Find the .torrent download control and the magnet control (NNM-Club declares TORRENT_DOWNLOAD + MAGNET_LINK)"
        expected: "Both a torrent-file download control and a magnet control are present and enabled"
      - name: "Obtain the torrent payload"
        action: "Trigger the .torrent download; capture the resulting payload"
        expected: "A non-empty .torrent file payload is produced (valid bencoded torrent) OR a magnet URI magnet:?xt=urn:btih:<hash> is resolved"
    tags: [nnmclub, download, torrent, magnet]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "A real user reaches a working, non-empty torrent file or a valid magnet URI for an NNM-Club result"
