#
# HelixQA Test Bank: Lava — RuTracker.org autonomous-QA MATRIX journey
# Scenario (the standing autonomous-QA matrix):
#   onboard -> select RuTracker -> authenticate (CAPTCHA_LOGIN) ->
#   search "1080p" (populated list) -> search "mp3" (populated list) ->
#   open first result details/topic -> obtain a download resource
#   (magnet / http / .torrent).
#
# Sibling of lava-rutracker-journey.yaml; this MATRIX variant pins the two
# specific queries ("1080p" video + "mp3" audio) the autonomous matrix runs
# against every provider, so the same human journey is proven identically
# across the provider fleet (§6.AE comprehensive Challenge coverage).
#
# Provider facts (from core/tracker/rutracker/.../RuTrackerDescriptor.kt):
#   id=rutracker  displayName="RuTracker.org"  authType=CAPTCHA_LOGIN
#   capabilities: SEARCH, BROWSE, FORUM, TOPIC, COMMENTS, FAVORITES,
#                 TORRENT_DOWNLOAD, MAGNET_LINK, AUTH_REQUIRED, CAPTCHA_LOGIN
#   baseUrls: https://rutracker.org (primary), rutracker.net, rutracker.cr
#
# Credentials per §6.H / §11.4.10: NEVER inline. The authenticating step
# loads RUTRACKER_USERNAME / RUTRACKER_PASSWORD from the runtime env at
# execution. The captcha is solved interactively at run time (never stored).
#
# Executor contract (submodules/helixqa pkg/orchestrator/definition_challenge.go):
#   - platforms: [android] routes each case to executeAndroidVisionSteps,
#     which builds a visionnav.Target{LaunchAction, ScreenGoals} and drives
#     the real device through the vision loop.
#   - LaunchAction (deriveLaunchAction): the FIRST non-skipped `adb_shell:`
#     step. Every case opens with an explicit-component launch
#     (am start -n .../MainActivity) because the debug build's LeakCanary
#     registers a 2nd LAUNCHER activity, making `monkey -p <pkg>` ambiguous.
#   - ScreenGoals (deriveScreenGoals): each entry in `required_evidence`,
#     then `expected_result`. These become OCR goal substrings the vision
#     model confirms from a real screenshot. required_evidence is AND — every
#     token MUST resolve on a real screen, so tokens stay short + reliably
#     visible (the typed query string, the on-screen download affordances).
version: "1.0"
name: "Lava — RuTracker.org Matrix Journey (1080p + mp3)"
description: "Autonomous-QA matrix journey on the Lava Android app for RuTracker: onboard, captcha-login auth, search 1080p, search mp3, open first result, obtain a magnet/http/.torrent download resource."
metadata:
  author: "vasic-digital"
  app: "Lava"
  application_id: "digital.vasic.lava.client.dev"
  provider_id: "rutracker"
  provider_display_name: "RuTracker.org"
  auth_type: "CAPTCHA_LOGIN"
  supports_anonymous: false
  credentials_env: ["RUTRACKER_USERNAME", "RUTRACKER_PASSWORD"]
  matrix_queries: ["1080p", "mp3"]

test_cases:
  - id: LAVA-RUTRACKER-MATRIX-001
    name: "Onboard and select the RuTracker provider"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava and reach onboarding"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "Onboarding Welcome screen is visible without a crash"
      - name: "Advance to the provider selection step"
        action: "Tap the primary continue control to reach provider configuration"
        expected: "Provider list shows RuTracker.org as a selectable entry"
      - name: "Select RuTracker"
        action: "Tap the RuTracker.org provider entry"
        expected: "RuTracker is marked selected and its captcha-login surface is reachable"
    required_evidence:
      - "RuTracker"
      - "provider"
    tags: [rutracker, onboarding, provider-selection, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "The provider list is on screen and RuTracker.org is a selectable entry that a user can choose, reaching its captcha-login surface"

  - id: LAVA-RUTRACKER-MATRIX-002
    name: "Authenticate to RuTracker with captcha-login credentials"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches onboarding/provider selection"
      - name: "Open the RuTracker login form"
        action: "Select RuTracker and open its credential entry surface"
        expected: "Username, password AND a captcha image plus a captcha-answer field are presented (CAPTCHA_LOGIN)"
      - name: "Enter real credentials from the runtime environment"
        action: "Type RUTRACKER_USERNAME and RUTRACKER_PASSWORD loaded from env (never hardcoded)"
        expected: "Username and password fields accept input; no validation error before captcha"
      - name: "Solve the captcha challenge"
        action: "Read the rendered captcha image and type the matching answer into the captcha-answer field"
        expected: "The captcha-answer field accepts the solution; the submit control becomes enabled"
      - name: "Submit and authenticate against the real RuTracker service"
        action: "Tap submit; wait for the network round-trip"
        expected: "Authentication succeeds; the loading indicator clears and the search surface becomes reachable (no stuck spinner)"
    required_evidence:
      - "Captcha"
    tags: [rutracker, auth, captcha-login, real-service, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "The RuTracker login form with username, password and a captcha challenge is on screen for a user to authenticate against the live service"

  - id: LAVA-RUTRACKER-MATRIX-003
    name: "Search RuTracker for '1080p' and get a populated result list"
    category: functional
    priority: high
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit the '1080p' video query"
        action: "Type the query 1080p and submit the search to the live tracker"
        expected: "A result list renders with rows carrying title, size and seed/leech counts; '1080p' appears in the query field and across result titles"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    required_evidence:
      - "1080p"
    tags: [rutracker, search, video, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "A populated, scrollable result list for the '1080p' query is visible on screen, with '1080p' shown in the search field and result titles"

  - id: LAVA-RUTRACKER-MATRIX-004
    name: "Search RuTracker for 'mp3' and get a populated result list"
    category: functional
    priority: high
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit the 'mp3' audio query"
        action: "Type the query mp3 and submit the search to the live tracker"
        expected: "A result list renders with audio-release rows carrying title, size and seed/leech counts; 'mp3' appears in the query field and across result titles"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    required_evidence:
      - "mp3"
    tags: [rutracker, search, audio, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "A populated, scrollable result list for the 'mp3' query is visible on screen, with 'mp3' shown in the search field and result titles"

  - id: LAVA-RUTRACKER-MATRIX-005
    name: "Open the first result and obtain a download resource"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the first result topic"
        action: "Run a search (e.g. the 1080p query) and tap the first result row to open its topic/detail screen"
        expected: "Topic detail renders with title, metadata and download affordances"
      - name: "Locate the download affordances"
        action: "Find the .torrent Download control and the Magnet control (RuTracker declares TORRENT_DOWNLOAD + MAGNET_LINK)"
        expected: "Both a torrent-file Download control and a Magnet control are present and enabled"
      - name: "Obtain the download resource"
        action: "Trigger the .torrent download (or copy the magnet); capture the resulting resource"
        expected: "A non-empty .torrent payload (valid bencoded torrent) is produced OR a magnet URI magnet:?xt=urn:btih:<hash> is resolved"
    required_evidence:
      - "Download"
      - "Magnet"
    tags: [rutracker, download, torrent, magnet, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "The topic detail screen shows working Download and Magnet controls for a RuTracker result, yielding a usable download resource (magnet / http / .torrent)"
