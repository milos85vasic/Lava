#
# HelixQA Test Bank: Lava — RuTor.info autonomous-QA MATRIX journey
# Scenario (the standing autonomous-QA matrix):
#   onboard -> select RuTor -> authenticate (FORM_LOGIN) OR continue
#   anonymously (supportsAnonymous=true) -> search "1080p" (populated list) ->
#   search "mp3" (populated list) -> open first result details/topic ->
#   obtain a download resource (magnet / http / .torrent).
#
# Sibling of lava-rutor-journey.yaml; this MATRIX variant pins the two
# specific queries ("1080p" video + "mp3" audio) the autonomous matrix runs
# against every provider (§6.AE comprehensive Challenge coverage).
#
# Provider facts (from core/tracker/rutor/.../RuTorDescriptor.kt):
#   id=rutor  displayName="RuTor.info"  authType=FORM_LOGIN  supportsAnonymous=true
#   capabilities: SEARCH, BROWSE, TOPIC, COMMENTS, TORRENT_DOWNLOAD,
#                 MAGNET_LINK, RSS, AUTH_REQUIRED
#   DEFAULT_DOWNLOAD_BASE_URL = https://d.rutor.info
#
# Anonymous path: RuTor supports searching/browsing without an account, so the
# auth case (002) accepts EITHER a successful form-login (RUTOR_USERNAME /
# RUTOR_PASSWORD from env) OR an anonymous "continue" that lands on a usable
# search surface. Both outcomes satisfy the scenario.
#
# Credentials per §6.H / §11.4.10: NEVER inline. The login path loads
# RUTOR_USERNAME / RUTOR_PASSWORD from the runtime env at execution.
#
# Executor contract (submodules/helixqa pkg/orchestrator/definition_challenge.go):
#   - platforms: [android] routes each case to executeAndroidVisionSteps,
#     which builds a visionnav.Target{LaunchAction, ScreenGoals} and drives
#     the real device through the vision loop.
#   - LaunchAction (deriveLaunchAction): the FIRST non-skipped `adb_shell:`
#     step (am start -n .../MainActivity, explicit component for LeakCanary).
#   - ScreenGoals (deriveScreenGoals): each entry in `required_evidence`,
#     then `expected_result`. required_evidence is AND — every token MUST
#     resolve on a real screen, so tokens stay short + reliably visible.
version: "1.0"
name: "Lava — RuTor.info Matrix Journey (1080p + mp3)"
description: "Autonomous-QA matrix journey on the Lava Android app for RuTor: onboard, form-login or anonymous, search 1080p, search mp3, open first result, obtain a magnet/http/.torrent download resource."
metadata:
  author: "vasic-digital"
  app: "Lava"
  application_id: "digital.vasic.lava.client.dev"
  provider_id: "rutor"
  provider_display_name: "RuTor.info"
  auth_type: "FORM_LOGIN"
  supports_anonymous: true
  credentials_env: ["RUTOR_USERNAME", "RUTOR_PASSWORD"]
  matrix_queries: ["1080p", "mp3"]

test_cases:
  - id: LAVA-RUTOR-MATRIX-001
    name: "Onboard and select the RuTor provider"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava and reach onboarding"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "Onboarding Welcome screen is visible without a crash"
      - name: "Advance to the provider selection step"
        action: "Tap the primary continue control to reach provider configuration"
        expected: "Provider list shows RuTor.info as a selectable entry"
      - name: "Select RuTor"
        action: "Tap the RuTor.info provider entry"
        expected: "RuTor is marked selected and its form-login (or anonymous) surface is reachable"
    required_evidence:
      - "RuTor"
      - "provider"
    tags: [rutor, onboarding, provider-selection, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "The provider list is on screen and RuTor.info is a selectable entry that a user can choose, reaching its form-login or anonymous surface"

  - id: LAVA-RUTOR-MATRIX-002
    name: "Authenticate to RuTor (form-login) or continue anonymously"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches onboarding/provider selection"
      - name: "Open the RuTor auth surface"
        action: "Select RuTor and open its credential entry / continue surface"
        expected: "Username and password fields are presented (FORM_LOGIN, no captcha) alongside an anonymous continue option (supportsAnonymous=true)"
      - name: "Authenticate or continue anonymously"
        action: "EITHER type RUTOR_USERNAME and RUTOR_PASSWORD loaded from env (never hardcoded) and submit, OR tap continue to proceed anonymously"
        expected: "Whichever path is taken, the loading indicator clears (no stuck spinner)"
      - name: "Reach the search surface"
        action: "Wait for navigation to complete after login/continue"
        expected: "The app reaches its usable Search surface within a few seconds"
    required_evidence:
      - "Search"
    tags: [rutor, auth, form-login, anonymous, real-service, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "After form-login OR anonymous continue, the app lands on a usable Search surface for RuTor with no perpetual spinner"

  - id: LAVA-RUTOR-MATRIX-003
    name: "Search RuTor for '1080p' and get a populated result list"
    category: functional
    priority: high
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit the '1080p' video query"
        action: "Type the query 1080p and submit the search to the live tracker"
        expected: "A result list renders with rows carrying title, size and seed/leech counts; '1080p' appears in the query field and across result titles"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    required_evidence:
      - "1080p"
    tags: [rutor, search, video, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "A populated, scrollable result list for the '1080p' query is visible on screen, with '1080p' shown in the search field and result titles"

  - id: LAVA-RUTOR-MATRIX-004
    name: "Search RuTor for 'mp3' and get a populated result list"
    category: functional
    priority: high
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit the 'mp3' audio query"
        action: "Type the query mp3 and submit the search to the live tracker"
        expected: "A result list renders with audio-release rows carrying title, size and seed/leech counts; 'mp3' appears in the query field and across result titles"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    required_evidence:
      - "mp3"
    tags: [rutor, search, audio, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "A populated, scrollable result list for the 'mp3' query is visible on screen, with 'mp3' shown in the search field and result titles"

  - id: LAVA-RUTOR-MATRIX-005
    name: "Open the first result and obtain a download resource"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the first result topic"
        action: "Run a search (e.g. the 1080p query) and tap the first result row to open its topic/detail screen"
        expected: "Topic detail renders with title, metadata and download affordances"
      - name: "Locate the download affordances"
        action: "Find the .torrent Download control and the Magnet control (RuTor declares TORRENT_DOWNLOAD + MAGNET_LINK; files served from d.rutor.info)"
        expected: "Both a torrent-file Download control and a Magnet control are present and enabled"
      - name: "Obtain the download resource"
        action: "Trigger the .torrent download (or copy the magnet); capture the resulting resource"
        expected: "A non-empty .torrent payload (valid bencoded torrent) is produced OR a magnet URI magnet:?xt=urn:btih:<hash> is resolved"
    required_evidence:
      - "Download"
      - "Magnet"
    tags: [rutor, download, torrent, magnet, matrix]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
      - type: constitution
        section: "6.AE"
        path: "CLAUDE.md"
    expected_result: "The topic detail screen shows working Download and Magnet controls for a RuTor result, yielding a usable download resource (magnet / http / .torrent)"
