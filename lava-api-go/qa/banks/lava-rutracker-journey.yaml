#
# HelixQA Test Bank: Lava — RuTracker.org provider journey
# Real human journey: onboard -> select RuTracker (CAPTCHA_LOGIN auth) ->
# search -> browse -> open result -> obtain a working .torrent / magnet download.
#
# Provider facts (from core/tracker/rutracker/.../RuTrackerDescriptor.kt):
#   id=rutracker  displayName="RuTracker.org"  authType=CAPTCHA_LOGIN
#   capabilities: SEARCH, BROWSE, FORUM, TOPIC, COMMENTS, FAVORITES,
#                 TORRENT_DOWNLOAD, MAGNET_LINK, AUTH_REQUIRED, CAPTCHA_LOGIN
#   baseUrls: https://rutracker.org (primary), rutracker.net, rutracker.cr
#   encoding: Windows-1251
#
# Provider-specific deviation vs the rutor (FORM_LOGIN) template: RuTracker is
# CAPTCHA_LOGIN, so the auth case (002) presents a username field, a password
# field AND a captcha-image + captcha-answer field, plus an explicit
# captcha-answer step before submit. This is the one structural difference from
# the form-login banks (kinozal/nnmclub).
#
# Credentials per §6.H / §11.4.10: NEVER inline. The authenticating step
# loads RUTRACKER_USERNAME / RUTRACKER_PASSWORD from the runtime env at
# execution. The captcha is solved interactively at run time (never stored).
#
# Executor contract (submodules/helixqa pkg/orchestrator/definition_challenge.go):
#   - platforms: [android] routes each case to executeAndroidVisionSteps,
#     which builds a visionnav.Target{LaunchAction, ScreenGoals} and drives
#     the real device through the vision loop.
#   - LaunchAction (deriveLaunchAction): the FIRST non-skipped `adb_shell:`/
#     `shell:` step. Every case opens with an explicit-component launch
#     (am start -n .../MainActivity) because the debug build's LeakCanary
#     registers a 2nd LAUNCHER activity, making `monkey -p <pkg>` ambiguous.
#   - ScreenGoals (deriveScreenGoals): each entry in `required_evidence`,
#     then `expected_result`. These become OCR goal substrings the vision
#     model confirms from a real screenshot.
version: "1.0"
name: "Lava — RuTracker.org Provider Journey"
description: "End-to-end RuTracker journey on the Lava Android app: onboard, captcha-login auth, search, browse, open topic, obtain torrent/magnet download."
metadata:
  author: "vasic-digital"
  app: "Lava"
  application_id: "digital.vasic.lava.client.dev"
  provider_id: "rutracker"
  provider_display_name: "RuTracker.org"
  auth_type: "CAPTCHA_LOGIN"

test_cases:
  - id: LAVA-RUTRACKER-001
    name: "Onboard and select the RuTracker provider"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava and reach onboarding"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "Onboarding Welcome screen is visible without a crash"
      - name: "Advance to the provider selection step"
        action: "Tap the primary continue control to reach provider configuration"
        expected: "Provider list shows RuTracker.org as a selectable entry"
      - name: "Select RuTracker"
        action: "Tap the RuTracker.org provider entry"
        expected: "RuTracker is marked selected and its captcha-login surface is reachable"
    required_evidence:
      - "RuTracker"
      - "provider"
    tags: [rutracker, onboarding, provider-selection]
    expected_result: "The provider list is on screen and RuTracker.org is a selectable entry that a user can choose, reaching its captcha-login surface"

  - id: LAVA-RUTRACKER-002
    name: "Authenticate to RuTracker with captcha-login credentials"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches onboarding/provider selection"
      - name: "Open the RuTracker login form"
        action: "Select RuTracker and open its credential entry surface"
        expected: "Username, password AND a captcha image plus a captcha-answer field are presented (CAPTCHA_LOGIN)"
      - name: "Enter real credentials from the runtime environment"
        action: "Type RUTRACKER_USERNAME and RUTRACKER_PASSWORD loaded from env (never hardcoded)"
        expected: "Username and password fields accept input; no validation error before captcha"
      - name: "Solve the captcha challenge"
        action: "Read the rendered captcha image and type the matching answer into the captcha-answer field"
        expected: "The captcha-answer field accepts the solution; the submit control becomes enabled"
      - name: "Submit and authenticate against the real RuTracker service"
        action: "Tap submit; wait for the network round-trip"
        expected: "Authentication succeeds; the loading indicator clears and the search surface becomes reachable (no stuck spinner)"
    required_evidence:
      - "Captcha"
    tags: [rutracker, auth, captcha-login, real-service]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "The RuTracker login form with username, password and a captcha challenge is on screen for a user to authenticate against the live service"

  - id: LAVA-RUTRACKER-003
    name: "Search RuTracker for a realistic query and browse results"
    category: functional
    priority: high
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit a realistic query"
        action: "Enter a realistic real-world query (e.g. a popular film or distro title) and submit the search to the live tracker"
        expected: "A result list renders with rows carrying title, size and seed/leech counts"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    required_evidence:
      - "results"
    tags: [rutracker, search, browse]
    expected_result: "A populated, scrollable result list of RuTracker torrents is visible on screen for the submitted query"

  - id: LAVA-RUTRACKER-004
    name: "Open a result and obtain a working download option"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open a search result topic"
        action: "Run a search, then tap the first result row to open its topic/detail screen"
        expected: "Topic detail renders with title, metadata and download affordances"
      - name: "Locate the download affordances"
        action: "Find the .torrent download control and the magnet control (RuTracker declares TORRENT_DOWNLOAD + MAGNET_LINK)"
        expected: "Both a torrent-file download control and a magnet control are present and enabled"
      - name: "Obtain the torrent payload"
        action: "Trigger the .torrent download; capture the resulting payload"
        expected: "A non-empty .torrent file payload is produced (valid bencoded torrent) OR a magnet URI magnet:?xt=urn:btih:<hash> is resolved"
    required_evidence:
      - "Magnet"
    tags: [rutracker, download, torrent, magnet]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "The topic detail screen shows a working Magnet and/or torrent Download control for a RuTracker result"
