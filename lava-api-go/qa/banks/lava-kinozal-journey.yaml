#
# HelixQA Test Bank: Lava — Kinozal.tv provider journey
# Real human journey: onboard -> select Kinozal (FORM_LOGIN auth) -> search ->
# browse -> open result -> obtain a working .torrent / magnet download.
#
# Provider facts (from core/tracker/kinozal/.../KinozalDescriptor.kt):
#   id=kinozal  displayName="Kinozal.tv"  authType=FORM_LOGIN
#   capabilities: SEARCH, BROWSE, TOPIC, TORRENT_DOWNLOAD, MAGNET_LINK,
#                 AUTH_REQUIRED
#   baseUrls: https://kinozal.tv (primary), https://kinozal.me
#   encoding: windows-1251
#
# Credentials per §6.H / §11.4.10: NEVER inline. The authenticating step
# loads KINOZAL_USERNAME / KINOZAL_PASSWORD from the runtime env at execution.
#
# Executor contract (submodules/helixqa pkg/orchestrator/definition_challenge.go):
#   - platforms: [android] routes each case to executeAndroidVisionSteps,
#     which builds a visionnav.Target{LaunchAction, ScreenGoals} and drives
#     the real device through the vision loop.
#   - LaunchAction (deriveLaunchAction): the FIRST non-skipped `adb_shell:`/
#     `shell:` step. Every case opens with an explicit-component launch
#     (am start -n .../MainActivity) because the debug build's LeakCanary
#     registers a 2nd LAUNCHER activity, making `monkey -p <pkg>` ambiguous.
#   - ScreenGoals (deriveScreenGoals): each entry in `required_evidence`,
#     then `expected_result`. These become OCR goal substrings the vision
#     model confirms from a real screenshot.
version: "1.0"
name: "Lava — Kinozal.tv Provider Journey"
description: "End-to-end Kinozal journey on the Lava Android app: onboard, form-login auth, search, browse, open topic, obtain torrent/magnet download."
metadata:
  author: "vasic-digital"
  app: "Lava"
  application_id: "digital.vasic.lava.client.dev"
  provider_id: "kinozal"
  provider_display_name: "Kinozal.tv"
  auth_type: "FORM_LOGIN"

test_cases:
  - id: LAVA-KINOZAL-001
    name: "Onboard and select the Kinozal provider"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava and reach onboarding"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "Onboarding Welcome screen is visible without a crash"
      - name: "Advance to the provider selection step"
        action: "Tap the primary continue control to reach provider configuration"
        expected: "Provider list shows Kinozal.tv as a selectable entry"
      - name: "Select Kinozal"
        action: "Tap the Kinozal.tv provider entry"
        expected: "Kinozal is marked selected and its form-login surface is reachable"
    required_evidence:
      - "Kinozal"
      - "provider"
    tags: [kinozal, onboarding, provider-selection]
    expected_result: "The provider list is on screen and Kinozal.tv is a selectable entry that a user can choose, reaching its form-login surface"

  - id: LAVA-KINOZAL-002
    name: "Authenticate to Kinozal with form-login credentials"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches onboarding/provider selection"
      - name: "Open the Kinozal login form"
        action: "Select Kinozal and open its credential entry surface"
        expected: "Username and password fields are presented (FORM_LOGIN, no captcha)"
      - name: "Enter real credentials from the runtime environment"
        action: "Type KINOZAL_USERNAME and KINOZAL_PASSWORD loaded from env (never hardcoded)"
        expected: "Fields accept input; no validation error before submit"
      - name: "Submit and authenticate against the real Kinozal service"
        action: "Tap submit; wait for the network round-trip"
        expected: "Authentication succeeds; the loading indicator clears and the search surface becomes reachable (no stuck spinner)"
    required_evidence:
      - "Password"
    tags: [kinozal, auth, form-login, real-service]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "The Kinozal login form with username and password fields is on screen for a user to authenticate against the live service"

  - id: LAVA-KINOZAL-003
    name: "Search Kinozal for a realistic query and browse results"
    category: functional
    priority: high
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open the search input"
        action: "Navigate to the search surface and focus the query field"
        expected: "Search input is editable"
      - name: "Submit a realistic query"
        action: "Enter a realistic real-world query (e.g. a popular film title) and submit the search to the live tracker"
        expected: "A result list renders with rows carrying title, size and seed/leech counts"
      - name: "Scroll the result list"
        action: "Swipe up to scroll additional results"
        expected: "List scrolls smoothly without crash"
    required_evidence:
      - "results"
    tags: [kinozal, search, browse]
    expected_result: "A populated, scrollable result list of Kinozal torrents is visible on screen for the submitted query"

  - id: LAVA-KINOZAL-004
    name: "Open a result and obtain a working download option"
    category: functional
    priority: critical
    platforms: [android]
    dispatches_to: "monkey -p digital.vasic.lava.client.dev 1"
    steps:
      - name: "Launch Lava"
        action: "adb_shell: am start -n digital.vasic.lava.client.dev/digital.vasic.lava.client.MainActivity"
        expected: "App reaches its main surface"
      - name: "Open a search result topic"
        action: "Run a search, then tap the first result row to open its topic/detail screen"
        expected: "Topic detail renders with title, metadata and download affordances"
      - name: "Locate the download affordances"
        action: "Find the .torrent download control and the magnet control (Kinozal declares TORRENT_DOWNLOAD + MAGNET_LINK; files served from kinozal.tv)"
        expected: "Both a torrent-file download control and a magnet control are present and enabled"
      - name: "Obtain the torrent payload"
        action: "Trigger the .torrent download; capture the resulting payload"
        expected: "A non-empty .torrent file payload is produced (valid bencoded torrent) OR a magnet URI magnet:?xt=urn:btih:<hash> is resolved"
    required_evidence:
      - "Magnet"
    tags: [kinozal, download, torrent, magnet]
    documentation_refs:
      - type: constitution
        section: "6.G"
        path: "CLAUDE.md"
    expected_result: "The topic detail screen shows a working Magnet and/or torrent Download control for a Kinozal result"
